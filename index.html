<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Apex: Velocity</title>
    <style>
        /* CSS Reset & Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #050510; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Game Container */
        #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlays */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; }
        
        /* Menus */
        .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 16, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 20; backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
        
        h1 { color: #0ff; font-size: 3rem; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 20px #0ff; margin-bottom: 20px; text-align: center; }
        h2 { color: #fff; font-size: 1.5rem; margin-bottom: 30px; font-weight: 300; }
        .score-display { color: #f0f; font-size: 1.2rem; margin-bottom: 20px; text-shadow: 0 0 10px #f0f; }

        button { background: linear-gradient(45deg, #0ff, #f0f); border: none; padding: 15px 40px; color: #fff; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3); transition: transform 0.1s; text-transform: uppercase; letter-spacing: 2px; }
        button:active { transform: scale(0.95); }

        /* HUD */
        .hud-top { display: flex; justify-content: space-between; padding: 20px; pointer-events: none; }
        .hud-element { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 255, 255, 0.3); padding: 10px 20px; border-radius: 10px; color: #fff; font-weight: bold; font-size: 1.2rem; backdrop-filter: blur(4px); box-shadow: 0 0 15px rgba(0, 255, 255, 0.1); }
        .speedometer { font-size: 2rem; color: #0ff; text-shadow: 0 0 10px #0ff; }
        .nitro-bar-container { width: 150px; height: 10px; background: #222; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .nitro-bar { width: 100%; height: 100%; background: #f0f; box-shadow: 0 0 10px #f0f; transition: width 0.1s; }

        /* Mobile Controls */
        .mobile-controls { display: none; justify-content: space-between; padding: 20px; padding-bottom: 40px; pointer-events: auto; width: 100%; }
        .control-group { display: flex; gap: 15px; }
        .btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(0, 255, 255, 0.3); border-radius: 50%; color: rgba(255, 255, 255, 0.5); font-size: 24px; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .btn:active { background: rgba(0, 255, 255, 0.3); color: #fff; border-color: #0ff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
        .btn-action { background: rgba(255, 0, 255, 0.1); border-color: rgba(255, 0, 255, 0.3); }
        .btn-action:active { background: rgba(255, 0, 255, 0.3); border-color: #f0f; box-shadow: 0 0 20px rgba(255, 0, 255, 0.5); }

        @media (max-width: 800px) {
            .mobile-controls { display: flex; }
            h1 { font-size: 2rem; }
        }
        
        /* Landscape Warning */
        #landscape-warning { display: none; }
        @media (orientation: portrait) {
            #landscape-warning { display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; color: #fff; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        }
    </style>
</head>
<body>

<div id="landscape-warning">
    <h2>Please Rotate Your Device</h2>
    <p>This game is best experienced in landscape mode.</p>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer" id="hud" class="hidden">
        <div class="hud-top">
            <div class="hud-element">
                Score: <span id="ui-score">0</span><br>
                High: <span id="ui-highscore">0</span>
            </div>
            <div class="hud-element" style="text-align: right;">
                <div class="speedometer"><span id="ui-speed">0</span> KM/H</div>
                <div class="nitro-bar-container"><div class="nitro-bar" id="ui-nitro"></div></div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="control-group">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="control-group">
                <div class="btn btn-action" id="btn-brake">B</div>
                <div class="btn btn-action" id="btn-nitro">N</div>
            </div>
        </div>
    </div>

    <div class="menu" id="main-menu">
        <h1>Neon Apex</h1>
        <h2 id="menu-highscore">High Score: 0</h2>
        <button id="start-btn">Start Engine</button>
        <p style="color: #666; margin-top: 20px;">Desktop: WASD/Arrows, Shift = Nitro, Space = Brake</p>
    </div>

    <div class="menu hidden" id="game-over-menu">
        <h1 style="color: #f03;">CRASHED</h1>
        <div class="score-display">Final Score: <span id="final-score">0</span></div>
        <button id="restart-btn">Race Again</button>
    </div>
</div>

<script>
/**
 * ENGINE CONFIGURATION & STATE
 * Uses purely Vanilla JS and HTML5 Canvas API
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize rendering
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

// Game State
let gameState = 'menu'; // menu, playing, gameover
let lastTime = 0;
let animationFrameId;

// Physics & Camera Settings
const FPS = 60;
const step = 1 / FPS;
const roadWidth = 2000;
const segmentLength = 200;
const rumbleLength = 3;
const drawDistance = 300; // Fake depth illusion
const fov = 100;
const cameraHeight = 1000;
const cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);

// Player/Car
let playerX = 0;
let playerZ = 0;
let speed = 0;
const maxSpeed = segmentLength / step; 
const accel = maxSpeed / 5;
const braking = -maxSpeed;
const decel = -maxSpeed / 5;
const offRoadDecel = -maxSpeed / 2;
const offRoadLimit = maxSpeed / 4;
let nitro = 100;
let isNitro = false;
const maxNitro = 100;

// Environment & Track
let track = [];
let trackLength = 0;
let traffic = [];
let particles = [];
let score = 0;
let highScore = localStorage.getItem('neonApexHighScore') || 0;

// Input Handling
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false, Shift: false, ' ': false };

window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });
window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

// Mobile Touch Controls mapping
const bindTouch = (id, keyState) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyState] = true; vibrate(15); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyState] = false; });
};
bindTouch('btn-left', 'ArrowLeft');
bindTouch('btn-right', 'ArrowRight');
bindTouch('btn-nitro', 'Shift');
bindTouch('btn-brake', 'ArrowDown');

function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}

// UI Elements
const uiScore = document.getElementById('ui-score');
const uiHighScore = document.getElementById('ui-highscore');
const uiSpeed = document.getElementById('ui-speed');
const uiNitro = document.getElementById('ui-nitro');
const hud = document.getElementById('hud');
const mainMenu = document.getElementById('main-menu');
const gameOverMenu = document.getElementById('game-over-menu');

document.getElementById('menu-highscore').innerText = `High Score: ${Math.floor(highScore)}`;
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

/**
 * MATH & PROJECTION (The Fake 3D Engine Core)
 */
function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    p.screen.scale = cameraDepth / p.camera.z;
    p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
    p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
    p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
}

function resetTrack() {
    track = [];
    // Procedural generation
    const numSegments = 3000;
    for (let i = 0; i < numSegments; i++) {
        // Create curves and hills procedurally
        let curve = 0;
        let y = 0;
        if (i > 100 && i < 300) curve = 2;
        if (i > 400 && i < 600) curve = -2;
        if (i > 700 && i < 1000) { curve = 1; y = Math.sin(i / 30) * 1000; }
        if (i > 1200 && i < 1500) { curve = -3; y = Math.cos(i / 20) * 1500; }
        if (i > 2000) y = Math.sin(i / 15) * 2000;

        track.push({
            index: i,
            p1: { world: { x: 0, y: 0, z: i * segmentLength }, camera: {}, screen: {} },
            p2: { world: { x: 0, y: 0, z: (i + 1) * segmentLength }, camera: {}, screen: {} },
            curve: curve,
            color: Math.floor(i / rumbleLength) % 2 ? 
                { road: '#111', grass: '#0a0a20', rumble: '#f0f', lane: '#111' } : 
                { road: '#1a1a1a', grass: '#050510', rumble: '#0ff', lane: '#fff' }
        });
        
        // Spawn Traffic randomly
        if (i > 50 && i % 40 === 0 && Math.random() > 0.3) {
            traffic.push({
                offset: (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.4),
                z: i * segmentLength,
                speed: maxSpeed * (0.3 + Math.random() * 0.3),
                color: Math.random() > 0.5 ? '#f00' : '#fa0'
            });
        }
    }
    // Smooth out Y transitions
    for (let i = 1; i < numSegments; i++) track[i].p1.world.y = track[i-1].p2.world.y = track[i-1].p2.world.y || track[i].p1.world.y;
    trackLength = track.length * segmentLength;
}

function findSegment(z) {
    return track[Math.floor(z / segmentLength) % track.length];
}

/**
 * RENDERING FUNCTIONS
 */
function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function renderBackground(ctx, speedPercent) {
    // Synthwave sky gradient
    let grad = ctx.createLinearGradient(0, 0, 0, height/2);
    grad.addColorStop(0, '#000010');
    grad.addColorStop(0.5, '#1a0033');
    grad.addColorStop(1, '#ff0066');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Fake Sun
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(width / 2, height / 2 - 50, 100, 0, Math.PI * 2);
    ctx.fill();
    
    // Grid Lines for sky illusion
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
    ctx.lineWidth = 2;
    for(let i=0; i<10; i++) {
        ctx.beginPath();
        ctx.moveTo(0, (height/2) * (i/10));
        ctx.lineTo(width, (height/2) * (i/10));
        ctx.stroke();
    }
}

function drawCar(ctx, x, y, scale, color, isPlayer, turn) {
    const w = 200 * scale * (width/1000);
    const h = 80 * scale * (width/1000);
    x = x - w / 2;
    y = y - h;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x, y + h - 5, w, 20);

    // Body
    ctx.fillStyle = color;
    ctx.fillRect(x, y + h * 0.4, w, h * 0.6);
    
    // Roof
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.2, y + h * 0.4);
    ctx.lineTo(x + w * 0.3, y);
    ctx.lineTo(x + w * 0.7, y);
    ctx.lineTo(x + w * 0.8, y + h * 0.4);
    ctx.fill();
    
    // Taillights
    ctx.fillStyle = (keys.ArrowDown || keys[' ']) && isPlayer ? '#f00' : '#800';
    ctx.fillRect(x + w * 0.1, y + h * 0.6, w * 0.2, h * 0.2);
    ctx.fillRect(x + w * 0.7, y + h * 0.6, w * 0.2, h * 0.2);

    // Wheels
    ctx.fillStyle = '#000';
    let wheelOffset = turn * w * 0.1;
    ctx.fillRect(x - w*0.05 + wheelOffset, y + h * 0.8, w * 0.2, h * 0.3);
    ctx.fillRect(x + w*0.85 + wheelOffset, y + h * 0.8, w * 0.2, h * 0.3);
    
    // Nitro flames
    if(isPlayer && isNitro) {
        ctx.fillStyle = '#0ff';
        ctx.beginPath();
        ctx.arc(x + w * 0.2, y + h * 0.7, Math.random() * 15 * scale, 0, Math.PI*2);
        ctx.arc(x + w * 0.8, y + h * 0.7, Math.random() * 15 * scale, 0, Math.PI*2);
        ctx.fill();
    }
}

function spawnParticles() {
    if (speed > maxSpeed * 0.5) {
        for(let i=0; i<3; i++) {
            particles.push({
                x: (Math.random() - 0.5) * width,
                y: height/2 + Math.random() * height/2,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() * 5 + 5) * (speed / maxSpeed),
                life: 1.0,
                color: isNitro ? '#0ff' : '#fff'
            });
        }
    }
}

function drawParticles(ctx) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x + width/2, p.y, 2, 20);
        
        if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1.0;
}

/**
 * MAIN GAME LOOP
 */
function update(dt) {
    if (gameState !== 'playing') return;

    // Movement Logic
    const playerSegment = findSegment(playerZ);
    const speedPercent = speed / maxSpeed;
    let dx = dt * 2 * speedPercent; // Turning speed
    
    // Input
    if (keys.ArrowLeft || keys.a) playerX -= dx;
    if (keys.ArrowRight || keys.d) playerX += dx;
    
    playerX -= (dx * speedPercent * playerSegment.curve * 3); // Centrifugal force

    // Nitro
    isNitro = (keys.Shift || keys.n) && nitro > 0;
    let currentAccel = accel;
    let currentMax = maxSpeed;
    
    if (isNitro) {
        currentAccel *= 2;
        currentMax *= 1.4;
        nitro -= 0.5;
        vibrate(5);
    } else if (nitro < maxNitro && speed > 0) {
        nitro += 0.05; // Recharge slowly
    }

    if (keys.ArrowUp || keys.w) speed += currentAccel;
    else if (keys.ArrowDown || keys.s || keys[' ']) speed += braking;
    else speed += decel;

    // Offroad penalty
    if ((playerX < -1 || playerX > 1) && speed > offRoadLimit) {
        speed += offRoadDecel;
        vibrate(10);
    }

    speed = Math.max(0, Math.min(speed, currentMax));
    playerZ += speed;

    if (playerZ >= trackLength) playerZ -= trackLength;

    // Traffic Logic & Collision
    for (let i = 0; i < traffic.length; i++) {
        let car = traffic[i];
        car.z += car.speed;
        if (car.z >= trackLength) car.z -= trackLength;
        
        // Simple AABB Collision prediction
        if (car.z > playerZ && car.z < playerZ + 500) {
            let diffX = Math.abs(playerX - car.offset);
            let diffZ = car.z - playerZ;
            
            if (diffX < 0.6 && diffZ < segmentLength * 1.5) {
                // Crash
                speed = 0;
                vibrate(200);
                gameState = 'gameover';
                document.getElementById('final-score').innerText = Math.floor(score);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neonApexHighScore', highScore);
                }
                hud.classList.add('hidden');
                gameOverMenu.classList.remove('hidden');
            }
        }
    }

    score += speedPercent * dt * 100;
    
    // Update UI
    uiScore.innerText = Math.floor(score);
    uiSpeed.innerText = Math.floor(speed / maxSpeed * 300);
    uiNitro.style.width = `${(nitro / maxNitro) * 100}%`;
    uiHighScore.innerText = Math.floor(highScore);
    
    spawnParticles();
}

function render() {
    ctx.clearRect(0, 0, width, height);
    
    const baseSegment = findSegment(playerZ);
    const basePercent = (playerZ % segmentLength) / segmentLength;
    
    // Dynamic Camera Effects
    let cameraShakeX = speed > (maxSpeed * 0.8) ? (Math.random() - 0.5) * 5 : 0;
    let cameraShakeY = speed > (maxSpeed * 0.8) ? (Math.random() - 0.5) * 5 : 0;
    
    const cameraZ = playerZ;
    let playerY = baseSegment.p1.world.y + (baseSegment.p2.world.y - baseSegment.p1.world.y) * basePercent;
    const cameraY = playerY + cameraHeight + cameraShakeY;
    const cameraX = (playerX * roadWidth) + cameraShakeX;

    renderBackground(ctx, speed / maxSpeed);

    let maxy = height;
    let x = 0, dx = 0;

    // Render Track (Back to Front)
    for (let n = 0; n < drawDistance; n++) {
        const segment = track[(baseSegment.index + n) % track.length];
        segment.looped = segment.index < baseSegment.index;
        
        // Curve perspective calculation
        x += dx;
        dx += segment.curve;

        project(segment.p1, (playerX * roadWidth) - x, cameraY, cameraZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);
        project(segment.p2, (playerX * roadWidth) - x - dx, cameraY, cameraZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);

        // Cull segments behind camera or below the drawn horizon
        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= maxy) continue;

        // Draw Grass & Road Layers
        drawPolygon(ctx, 0, segment.p1.screen.y, width, segment.p1.screen.y, width, segment.p2.screen.y, 0, segment.p2.screen.y, segment.color.grass);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w * 1.2, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w * 1.2, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w * 1.2, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w * 1.2, segment.p2.screen.y, segment.color.rumble);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w, segment.p2.screen.y, segment.color.road);

        // Center line
        if (segment.color.lane) {
            let laneW = segment.p1.screen.w * 0.05;
            let laneW2 = segment.p2.screen.w * 0.05;
            drawPolygon(ctx, segment.p1.screen.x - laneW, segment.p1.screen.y, segment.p1.screen.x + laneW, segment.p1.screen.y, segment.p2.screen.x + laneW2, segment.p2.screen.y, segment.p2.screen.x - laneW2, segment.p2.screen.y, segment.color.lane);
        }

        maxy = segment.p1.screen.y;
    }

    // Render Sprites & Cars (Back to Front)
    for (let n = drawDistance - 1; n > 0; n--) {
        const segment = track[(baseSegment.index + n) % track.length];
        
        // Traffic
        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            let carSegment = findSegment(car.z);
            if (carSegment.index === segment.index) {
                let carScale = segment.p1.screen.scale;
                let carX = segment.p1.screen.x + (carScale * car.offset * roadWidth * width / 2);
                let carY = segment.p1.screen.y;
                drawCar(ctx, carX, carY, carScale, car.color, false, 0);
            }
        }

        // Draw Player Car
        if (n === 10) { 
            // Placed slightly ahead of camera to simulate chase view
            let playerScale = cameraDepth / (segmentLength * 10);
            let pX = width / 2;
            let pY = height - 50 + cameraShakeY;
            let turnAngle = (keys.ArrowLeft ? -1 : keys.ArrowRight ? 1 : 0);
            drawCar(ctx, pX, pY, playerScale * 0.7, '#fff', true, turnAngle);
        }
    }

    drawParticles(ctx);
}

function loop(time) {
    if (gameState === 'playing') {
        const dt = (time - lastTime) / 1000 || step;
        update(dt);
        render();
    }
    lastTime = time;
    animationFrameId = requestAnimationFrame(loop);
}

function startGame() {
    mainMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');
    hud.classList.remove('hidden');
    
    playerX = 0;
    playerZ = 0;
    speed = 0;
    score = 0;
    nitro = maxNitro;
    traffic = [];
    resetTrack();
    
    gameState = 'playing';
    lastTime = performance.now();
    cancelAnimationFrame(animationFrameId);
    loop(lastTime);
}

// Init Setup
resetTrack();
render(); // Draw initial static screen
</script>
</body>
</html>
