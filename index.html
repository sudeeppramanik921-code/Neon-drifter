<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DRIFTER: Cyberpunk Runner</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        /* ========================================================
           CSS: STYLING & UI UX DESIGN
           Glassmorphism, Neon Effects, and Responsive Layout
           ======================================================== */
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --dark-bg: rgba(10, 10, 20, 0.85);
            --glass-bg: rgba(20, 20, 35, 0.6);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #050510;
            overflow: hidden; /* Prevent scrolling on mobile */
            color: white;
            touch-action: none; /* Crucial for custom swipe logic */
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Scanline Overlay for Cyberpunk feel */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* UI Containers */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through unless on a button */
            transition: opacity 0.3s ease;
        }

        .hidden { opacity: 0; pointer-events: none !important; display: none !important; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            pointer-events: auto;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            margin-bottom: 20px;
        }

        h2 { font-size: 2rem; margin-bottom: 15px; color: var(--neon-blue); }
        p { font-size: 1.2rem; margin-bottom: 10px; }

        /* Neon Buttons */
        button {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 10px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2) inset;
        }

        button:hover, button:active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
        }

        button.pink-btn {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 234, 0.2) inset;
        }
        button.pink-btn:hover, button.pink-btn:active {
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }
        
        .hud-stat {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div class="scanlines"></div>

    <div id="hud" class="hidden">
        <div class="hud-stat">SCORE: <span id="scoreDisplay">0</span></div>
        <div class="hud-stat" style="text-shadow: 0 0 8px var(--neon-pink);">COINS: <span id="coinDisplay">0</span></div>
    </div>

    <div id="mainMenu" class="ui-layer">
        <div class="glass-panel">
            <h1>NEON DRIFTER</h1>
            <p>High Score: <span id="menuHighScore">0</span></p>
            <p>Total Coins: <span id="menuTotalCoins">0</span></p>
            <button id="btnPlay">Initialize Run</button>
            <br>
            <div class="controls-hint">
                Desktop: Arrows / WASD to Move, SPACE to Jump<br>
                Mobile: Swipe Left/Right, Swipe Up to Jump
            </div>
        </div>
    </div>

    <div id="gameOverScreen" class="ui-layer hidden">
        <div class="glass-panel">
            <h1 style="color: red; text-shadow: 0 0 10px red;">SYSTEM FAILURE</h1>
            <h2>Run Terminated</h2>
            <p>Score: <span id="endScore">0</span></p>
            <p>Coins Collected: <span id="endCoins">0</span></p>
            <button id="btnRestart">Reboot System</button>
            <button id="btnMenu" class="pink-btn">Main Menu</button>
        </div>
    </div>

    <script>
        /* ========================================================
           JAVASCRIPT: GAME ENGINE & LOGIC
           Modular, Single-File Architecture
           ======================================================== */

        // --- 1. CORE UTILITIES & STORAGE ---
        const Storage = {
            save(key, value) { localStorage.setItem(`NeonDrifter_${key}`, JSON.stringify(value)); },
            load(key, defaultVal) { 
                const data = localStorage.getItem(`NeonDrifter_${key}`);
                return data ? JSON.parse(data) : defaultVal;
            }
        };

        // --- 2. AUDIO SYSTEM (Web Audio API Synthesizer) ---
        // Avoids massive base64 strings by generating procedural retro sounds
        const AudioSys = {
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            playTone(freq, type, duration, vol=0.1) {
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            jump() { this.playTone(400, 'sine', 0.3, 0.2); setTimeout(()=>this.playTone(600, 'sine', 0.2, 0.2), 50); },
            coin() { this.playTone(1200, 'square', 0.1, 0.1); setTimeout(()=>this.playTone(1600, 'square', 0.2, 0.1), 100); },
            crash() { this.playTone(100, 'sawtooth', 0.5, 0.3); this.playTone(50, 'square', 0.7, 0.3); }
        };

        // --- 3. GAME CONFIG & STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize performance
        
        let GAME_W = window.innerWidth;
        let GAME_H = window.innerHeight;
        canvas.width = GAME_W;
        canvas.height = GAME_H;

        window.addEventListener('resize', () => {
            GAME_W = window.innerWidth;
            GAME_H = window.innerHeight;
            canvas.width = GAME_W;
            canvas.height = GAME_H;
        });

        const STATE = {
            menu: 0,
            playing: 1,
            gameover: 2
        };

        const Game = {
            state: STATE.menu,
            score: 0,
            coins: 0,
            highScore: Storage.load('highScore', 0),
            totalCoins: Storage.load('totalCoins', 0),
            speed: 15,
            baseSpeed: 15,
            distance: 0,
            frame: 0
        };

        // --- 4. INPUT MANAGEMENT (Keyboard & Touch) ---
        const Input = {
            left: false, right: false, up: false, down: false,
            touchStartX: 0, touchStartY: 0,
            
            init() {
                // Keyboard
                window.addEventListener('keydown', e => this.handleKey(e, true));
                window.addEventListener('keyup', e => this.handleKey(e, false));
                
                // Touch Swipe Logic
                canvas.addEventListener('touchstart', e => {
                    this.touchStartX = e.changedTouches[0].screenX;
                    this.touchStartY = e.changedTouches[0].screenY;
                });
                
                canvas.addEventListener('touchend', e => {
                    let endX = e.changedTouches[0].screenX;
                    let endY = e.changedTouches[0].screenY;
                    this.handleSwipe(this.touchStartX, this.touchStartY, endX, endY);
                });
            },

            handleKey(e, isDown) {
                if(e.code === 'ArrowLeft' || e.code === 'KeyA') this.left = isDown;
                if(e.code === 'ArrowRight' || e.code === 'KeyD') this.right = isDown;
                if(e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') this.up = isDown;
                if(e.code === 'ArrowDown' || e.code === 'KeyS') this.down = isDown;
            },

            handleSwipe(startX, startY, endX, endY) {
                let diffX = endX - startX;
                let diffY = endY - startY;
                if(Math.abs(diffX) > Math.abs(diffY)) {
                    // Horizontal swipe
                    if(diffX > 30) { Player.moveLane(1); } // Swipe Right
                    else if(diffX < -30) { Player.moveLane(-1); } // Swipe Left
                } else {
                    // Vertical swipe
                    if(diffY < -30) { Player.jump(); } // Swipe Up
                    else if(diffY > 30) { Player.slide(); } // Swipe Down
                }
            }
        };

        // --- 5. CAMERA & PSEUDO-3D PROJECTION ---
        const Camera = { x: 0, y: 150, z: 0, fov: 300 };

        function project3D(x, y, z) {
            let relativeZ = z - Camera.z;
            if (relativeZ <= 0) return null; // Behind camera
            let scale = Camera.fov / relativeZ;
            let projectedX = (x - Camera.x) * scale + GAME_W / 2;
            let projectedY = (y - Camera.y) * scale + GAME_H / 2;
            return { x: projectedX, y: projectedY, scale: scale };
        }

        // --- 6. ENTITIES (Player, Obstacles, Particles) ---
        const LANE_WIDTH = 120;

        const Player = {
            lane: 0, // -1 (Left), 0 (Center), 1 (Right)
            x: 0, y: 0, z: 100, // Fixed z-distance from camera
            width: 40, height: 80,
            velY: 0, gravity: -1.5, jumpPower: 25,
            isJumping: false, isSliding: false,
            color: '#00f3ff',

            reset() {
                this.lane = 0; this.x = 0; this.y = 0;
                this.velY = 0; this.isJumping = false; this.isSliding = false;
            },

            moveLane(dir) {
                if (this.lane + dir >= -1 && this.lane + dir <= 1) {
                    this.lane += dir;
                }
            },

            jump() {
                if(!this.isJumping) {
                    this.velY = this.jumpPower;
                    this.isJumping = true;
                    AudioSys.jump();
                }
            },

            slide() {
                if(!this.isJumping && !this.isSliding) {
                    this.isSliding = true;
                    this.height = 40; // Shrink hitbox
                    setTimeout(() => { this.isSliding = false; this.height = 80; }, 800);
                }
            },

            update() {
                // Smooth lane interpolation
                let targetX = this.lane * LANE_WIDTH;
                this.x += (targetX - this.x) * 0.2;

                // Keyboard Controls triggers
                if(Input.left) { this.moveLane(-1); Input.left = false; }
                if(Input.right) { this.moveLane(1); Input.right = false; }
                if(Input.up) { this.jump(); Input.up = false; }
                if(Input.down) { this.slide(); Input.down = false; }

                // Physics
                if(this.isJumping) {
                    this.y += this.velY;
                    this.velY += this.gravity;
                    if(this.y <= 0) {
                        this.y = 0;
                        this.isJumping = false;
                        this.velY = 0;
                    }
                }
                
                // Trail Particles
                if(Game.frame % 3 === 0) {
                    Particles.spawn(this.x, this.y + 20, this.z, this.color);
                }
            },

            draw() {
                let p = project3D(this.x, -this.y, this.z);
                if(!p) return;
                
                let w = this.width * p.scale;
                let h = this.height * p.scale;
                
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillStyle = "rgba(0, 243, 255, 0.8)";
                
                // Draw a sleek futuristic bike/character shape
                ctx.beginPath();
                ctx.moveTo(p.x, p.y - h);
                ctx.lineTo(p.x + w/2, p.y);
                ctx.lineTo(p.x - w/2, p.y);
                ctx.closePath();
                ctx.fill();
                
                // Core glow
                ctx.fillStyle = "#fff";
                ctx.fillRect(p.x - w/6, p.y - h + 10, w/3, h - 20);
                ctx.restore();
            }
        };

        // --- OBJECT POOLING & PROCEDURAL GENERATION ---
        const World = {
            entities: [], // Obstacles and Coins
            lanes: [-1, 0, 1],
            spawnZ: 3000, // Spawn far away
            
            reset() { this.entities = []; },

            spawnSegment() {
                let spawnType = Math.random();
                let lane = this.lanes[Math.floor(Math.random() * this.lanes.length)];
                
                if(spawnType > 0.4) {
                    // Spawn Obstacle (Blocker)
                    this.entities.push({
                        type: 'obstacle',
                        x: lane * LANE_WIDTH,
                        y: 0,
                        z: Camera.z + this.spawnZ,
                        w: 80, h: 80,
                        active: true
                    });
                } else if(spawnType > 0.1) {
                    // Spawn Coins in a line
                    for(let i=0; i<3; i++) {
                        this.entities.push({
                            type: 'coin',
                            x: lane * LANE_WIDTH,
                            y: 20, // slightly elevated
                            z: Camera.z + this.spawnZ + (i * 150),
                            w: 30, h: 30,
                            active: true
                        });
                    }
                }
            },

            update() {
                if(Game.frame % 30 === 0) this.spawnSegment(); // Generate map dynamically

                // Clean up entities behind camera
                this.entities = this.entities.filter(e => e.z > Camera.z && e.active);

                for(let e of this.entities) {
                    // Collision Detection (AABB translated to pseudo-3D)
                    if(Math.abs(e.z - Player.z) < 50) { 
                        if(Math.abs(e.x - Player.x) < 40) { // Same lane
                            if(e.type === 'obstacle' && Player.y < e.h - 10) { // Hit obstacle!
                                gameOver();
                            } else if (e.type === 'coin') {
                                e.active = false; // Collect
                                Game.coins++;
                                Game.score += 10;
                                updateHUD();
                                AudioSys.coin();
                                // Explode into particles
                                for(let i=0; i<5; i++) Particles.spawn(e.x, e.y, e.z, '#ff00ea');
                            }
                        }
                    }
                }
            },

            draw() {
                // Draw Grid/Road
                ctx.strokeStyle = "rgba(0, 243, 255, 0.2)";
                ctx.lineWidth = 2;
                
                // Draw Horizon and lanes
                let hLines = 20;
                for(let i=0; i<hLines; i++) {
                    let z = Camera.z + ((Math.floor(Camera.z / 100) * 100) + i * 150) - Camera.z;
                    if(z <= 0) continue;
                    
                    let p1 = project3D(-LANE_WIDTH * 2, 0, Camera.z + z);
                    let p2 = project3D(LANE_WIDTH * 2, 0, Camera.z + z);
                    
                    if(p1 && p2) {
                        // Neon distance fade
                        ctx.strokeStyle = `rgba(255, 0, 234, ${1 - z/3000})`;
                        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                }

                // Draw Entities (Sort by Z for correct drawing order)
                this.entities.sort((a,b) => b.z - a.z);
                
                for(let e of this.entities) {
                    let p = project3D(e.x, -e.y, e.z);
                    if(!p) continue;
                    
                    let w = e.w * p.scale;
                    let h = e.h * p.scale;

                    ctx.save();
                    if(e.type === 'obstacle') {
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = 'red';
                        ctx.fillStyle = "rgba(255, 0, 50, 0.9)";
                        ctx.fillRect(p.x - w/2, p.y - h, w, h);
                        // Sci-fi detail lines
                        ctx.strokeStyle = "#fff";
                        ctx.strokeRect(p.x - w/2, p.y - h, w, h);
                    } else if(e.type === 'coin') {
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = '#ff00ea';
                        ctx.fillStyle = "#ff00ea";
                        ctx.beginPath();
                        ctx.arc(p.x, p.y - h/2, w/2, 0, Math.PI*2);
                        ctx.fill();
                        // Inner glow core
                        ctx.fillStyle = "#fff";
                        ctx.beginPath();
                        ctx.arc(p.x, p.y - h/2, w/4, 0, Math.PI*2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }
        };

        // --- PARTICLE SYSTEM ---
        const Particles = {
            pool: [],
            spawn(x, y, z, color) {
                this.pool.push({
                    x: x + (Math.random()*20-10), 
                    y: y + (Math.random()*20-10), 
                    z: z,
                    vx: (Math.random()*2-1), vy: (Math.random()*2-1),
                    life: 1.0, color: color
                });
            },
            updateAndDraw() {
                for(let i = this.pool.length - 1; i >= 0; i--) {
                    let pt = this.pool[i];
                    pt.x += pt.vx; pt.y += pt.vy;
                    pt.life -= 0.05;
                    
                    if(pt.life <= 0 || pt.z <= Camera.z) {
                        this.pool.splice(i, 1);
                        continue;
                    }

                    let p = project3D(pt.x, -pt.y, pt.z);
                    if(!p) continue;

                    ctx.globalAlpha = pt.life;
                    ctx.fillStyle = pt.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3 * p.scale, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
        };

        // --- 7. GAME LOOP & STATE CONTROLS ---
        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = Math.floor(Game.score);
            document.getElementById('coinDisplay').innerText = Game.coins;
        }

        function startGame() {
            Game.state = STATE.playing;
            Game.score = 0; Game.coins = 0;
            Game.speed = Game.baseSpeed;
            Camera.z = 0;
            Player.reset();
            World.reset();
            Particles.pool = [];
            
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            updateHUD();
            
            // Audio context requires user interaction to start completely
            AudioSys.ctx.resume();
        }

        function gameOver() {
            Game.state = STATE.gameover;
            AudioSys.crash();
            
            // Camera Shake effect
            canvas.style.transform = "translate(5px, 5px)";
            setTimeout(()=> canvas.style.transform = "translate(-5px, -5px)", 50);
            setTimeout(()=> canvas.style.transform = "translate(5px, -5px)", 100);
            setTimeout(()=> canvas.style.transform = "translate(0, 0)", 150);

            // Save Data
            if(Game.score > Game.highScore) {
                Game.highScore = Math.floor(Game.score);
                Storage.save('highScore', Game.highScore);
            }
            Game.totalCoins += Game.coins;
            Storage.save('totalCoins', Game.totalCoins);

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            
            document.getElementById('endScore').innerText = Math.floor(Game.score);
            document.getElementById('endCoins').innerText = Game.coins;
        }

        function returnToMenu() {
            Game.state = STATE.menu;
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            
            document.getElementById('menuHighScore').innerText = Game.highScore;
            document.getElementById('menuTotalCoins').innerText = Game.totalCoins;
        }

        function renderBackground() {
            // Draw gradient sky
            let grad = ctx.createLinearGradient(0, 0, 0, GAME_H/2);
            grad.addColorStop(0, "#0a0a1a");
            grad.addColorStop(1, "#1a0b2e");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, GAME_W, GAME_H);

            // Draw a glowing sun/moon
            ctx.save();
            ctx.shadowBlur = 50;
            ctx.shadowColor = "#ff00ea";
            ctx.fillStyle = "#ff00ea";
            ctx.beginPath();
            ctx.arc(GAME_W/2, GAME_H/2 - 50, 80, 0, Math.PI*2);
            ctx.fill();
            
            // Retro sun cutouts
            ctx.globalCompositeOperation = "destination-out";
            for(let i=0; i<6; i++) {
                ctx.fillRect(GAME_W/2 - 100, (GAME_H/2 - 20) + (i*15), 200, 5 + (i*2));
            }
            ctx.restore();
            
            // Ground
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, GAME_H/2, GAME_W, GAME_H/2);
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            Game.frame++;

            // Clear Screen & Draw Static BG
            ctx.clearRect(0, 0, GAME_W, GAME_H);
            renderBackground();

            if (Game.state === STATE.playing) {
                // Update Logic
                Camera.z += Game.speed;
                Game.score += Game.speed * 0.01;
                Game.speed += 0.001; // Procedural difficulty increase

                Player.update();
                World.update();

                if(Game.frame % 10 === 0) updateHUD();
            } else if (Game.state === STATE.menu) {
                // Menu idle animation
                Camera.z += 2;
                World.update();
            }

            // Draw 3D Layer
            World.draw();
            if(Game.state === STATE.playing) Player.draw();
            Particles.updateAndDraw();
        }

        // --- 8. INITIALIZATION ---
        window.onload = () => {
            Input.init();
            
            // Load saved UI data
            document.getElementById('menuHighScore').innerText = Game.highScore;
            document.getElementById('menuTotalCoins').innerText = Game.totalCoins;

            // Button Listeners
            document.getElementById('btnPlay').addEventListener('click', startGame);
            document.getElementById('btnRestart').addEventListener('click', startGame);
            document.getElementById('btnMenu').addEventListener('click', returnToMenu);

            // Start loop
            gameLoop();
        };
    </script>
</body>
</html>
