<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velocity Apex: Ultimate Dual-Drive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #03030a; overflow: hidden; font-family: 'Montserrat', sans-serif; }
        
        #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; background: #000; }

        /* General Overlay HUD Systems */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; }
        .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 3, 12, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 20; backdrop-filter: blur(10px); text-align: center; padding: 20px; }
        .hidden { display: none !important; }
        
        h1 { color: #0ffff0; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 20px rgba(0,255,255,0.6); margin-bottom: 10px; }
        h2 { color: #fff; font-size: 1.2rem; margin-bottom: 30px; font-weight: 300; opacity: 0.8; }
        
        button { background: linear-gradient(135deg, #00ffff, #ff00ff); border: none; padding: 18px 45px; color: #fff; font-size: 1.3rem; font-weight: bold; border-radius: 40px; cursor: pointer; box-shadow: 0 8px 25px rgba(255, 0, 255, 0.4); transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; letter-spacing: 2px; }
        button:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(255, 0, 255, 0.2); }

        /* Game Running HUD */
        .hud-top { display: flex; justify-content: space-between; width: 100%; padding: 15px; pointer-events: none; }
        .hud-card { background: rgba(5, 5, 20, 0.65); border: 1px solid rgba(0, 255, 255, 0.25); padding: 8px 16px; border-radius: 12px; color: #fff; font-weight: bold; font-size: 1rem; backdrop-filter: blur(5px); }
        .speedometer { font-size: 1.8rem; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.5); font-style: italic; }
        .nitro-container { width: 120px; height: 8px; background: #111; border-radius: 4px; margin-top: 4px; overflow: hidden; border: 1px solid rgba(255,0,255,0.3); }
        .nitro-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff00ff, #00ffff); box-shadow: 0 0 8px #ff00ff; }

        /* Touch Interfaces Optimized structurally for both Portrait 9:16 and Landscape 16:9 */
        .mobile-controls { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 20px; pointer-events: auto; }
        .control-block { display: flex; gap: 12px; }
        .touch-btn { width: 75px; height: 75px; background: rgba(255, 255, 255, 0.07); border: 2px solid rgba(0, 255, 255, 0.3); border-radius: 50%; color: rgba(255, 255, 255, 0.7); font-size: 26px; display: flex; justify-content: center; align-items: center; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .touch-btn:active { background: rgba(0, 255, 255, 0.35); color: #fff; border-color: #0ffff0; box-shadow: 0 0 15px rgba(0, 255, 255, 0.6); }
        .btn-drive { background: rgba(0, 255, 100, 0.07); border-color: rgba(0, 255, 100, 0.4); }
        .btn-drive:active { background: rgba(0, 255, 100, 0.35); border-color: #00ff66; box-shadow: 0 0 15px rgba(0, 255, 100, 0.6); }
        .btn-brake { background: rgba(255, 0, 80, 0.07); border-color: rgba(255, 0, 80, 0.4); }
        .btn-brake:active { background: rgba(255, 0, 80, 0.35); border-color: #ff0050; box-shadow: 0 0 15px rgba(255, 0, 80, 0.6); }
        
        /* Adjust control layout gracefully if viewport scale falls into native portrait dimensions */
        @media(orientation: portrait) {
            h1 { font-size: 1.9rem; }
            .touch-btn { width: 65px; height: 65px; font-size: 22px; }
            .mobile-controls { padding: 12px; padding-bottom: 30px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer id="hud">
        <div class="hud-top">
            <div class="hud-card">
                SCORE <div id="ui-score" style="color: #ff00ff; font-size: 1.3rem;">0</div>
                HIGH <span id="ui-highscore" style="opacity: 0.6;">0</span>
            </div>
            <div class="hud-card" style="text-align: right;">
                <div class="speedometer"><span id="ui-speed">0</span> KM/H</div>
                <div style="font-size: 0.75rem; opacity: 0.7; letter-spacing: 1px;">NITRO BOOST</div>
                <div class="nitro-container"><div class="nitro-fill" id="ui-nitro"></div></div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="control-block">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="control-block">
                <div class="touch-btn btn-brake" id="btn-brake">B</div>
                <div class="touch-btn btn-drive" id="btn-gas">G</div>
                <div class="touch-btn" id="btn-nitro" style="background: rgba(255,0,255,0.1); border-color: #ff00ff;">N</div>
            </div>
        </div>
    </div>

    <div class="menu" id="main-menu">
        <h1>VELOCITY APEX</h1>
        <h2 id="menu-highscore">BEST ATTAINED: 0</h2>
        <button id="start-btn">Launch Race</button>
        <p style="color: #666e80; margin-top: 25px; font-size: 0.85rem; line-height: 1.4;">
            <b>Desktop Controls:</b> W / Up = Gas | S / Down = Brake | A/D = Steer | Shift = Nitro
        </p>
    </div>

    <div class="menu hidden" id="game-over-menu">
        <h1 style="color: #ff0055; text-shadow: 0 0 20px rgba(255,0,85,0.4);">IMPACT CRASH</h1>
        <div style="color: #fff; font-size: 1.4rem; margin: 20px 0;">Total Score: <span id="final-score" style="color: #00ffff; font-weight: bold;">0</span></div>
        <button id="restart-btn">Re-Ignite Engine</button>
    </div>
</div>

<script>
/**
 * AUDIO SYNTHESIS SUBSYSTEM (Web Audio API Architecture)
 * Generates music tracks and dynamic motor runtime effects via native code processing.
 */
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.osc = null;
        this.gain = null;
        this.musicInterval = null;
        this.muted = false;
    }
    
    init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.setupEngineSound();
        this.startSynthMusic();
    }

    setupEngineSound() {
        this.osc = this.ctx.createOscillator();
        this.gain = this.ctx.createGain();
        this.osc.type = 'sawtooth';
        this.osc.frequency.setValueAtTime(40, this.ctx.currentTime);
        this.gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        
        // Lowpass filter for engine realism
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, this.ctx.currentTime);

        this.osc.connect(filter);
        filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);
        this.osc.start(0);
    }

    updateEngine(speedRatio, isNitro) {
        if (!this.osc) return;
        // Pitch shifting based on simulated throttle speed percentage
        let pitch = 40 + (speedRatio * 160) + (isNitro ? 40 : 0);
        this.osc.frequency.setTargetAtTime(pitch, this.ctx.currentTime, 0.1);
        this.gain.gain.setTargetAtTime(0.04 + (speedRatio * 0.06), this.ctx.currentTime, 0.1);
    }

    triggerCrashSound() {
        if (!this.ctx) return;
        let bufferSize = this.ctx.sampleRate * 0.4;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(120, this.ctx.currentTime);
        
        let crashGain = this.ctx.createGain();
        crashGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        crashGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

        noise.connect(filter);
        filter.connect(crashGain);
        crashGain.connect(this.ctx.destination);
        noise.start(0);
    }

    startSynthMusic() {
        // Procedural loop mimicking cyberpunk basslines
        let notes = [55, 55, 65.41, 55, 73.42, 55, 48.99, 65.41]; 
        let index = 0;
        
        this.musicInterval = setInterval(() => {
            if (this.muted || !this.ctx || gameState !== 'playing') return;
            try {
                let osc = this.ctx.createOscillator();
                let g = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[index], this.ctx.currentTime);
                g.gain.setValueAtTime(0.08, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
                
                osc.connect(g);
                g.connect(this.ctx.destination);
                osc.start(0);
                osc.stop(this.ctx.currentTime + 0.25);
                
                index = (index + 1) % notes.length;
            } catch(e){}
        }, 250);
    }
}

const audio = new SoundEngine();

/**
 * GRAPHICS CORE & PERSPECTIVE SIMULATOR
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

let gameState = 'menu';
let lastTime = 0;
let animationFrameId;

// Environment Constants
const roadWidth = 2200;
const segmentLength = 200;
const rumbleLength = 3;
const drawDistance = 240; 
let fov = 100;
const cameraHeight = 1100;

// Dynamic FOV calculations relative to landscape/portrait changes
let cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);

// Player Physics Configurations
let playerX = 0;
let playerZ = 0;
let speed = 0;
const maxSpeed = segmentLength / (1/60); 
const accel = maxSpeed / 4.5;
const braking = -maxSpeed * 1.2;
const decel = -maxSpeed / 5;
let nitro = 100;
let isNitro = false;

// Arrays
let track = [];
let trackLength = 0;
let traffic = [];
let particles = [];
let score = 0;
let highScore = localStorage.getItem('velocityApexHigh') || 0;

// Core Input Array
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false, Shift: false };

window.addEventListener('keydown', (e) => { 
    if (e.key === 'ArrowUp' || e.key === 'w') keys.ArrowUp = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.ArrowDown = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.ArrowLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.ArrowRight = true;
    if (e.key === 'Shift') keys.Shift = true;
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.ArrowUp = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.ArrowDown = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.ArrowLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.ArrowRight = false;
    if (e.key === 'Shift') keys.Shift = false;
});

// Structural UI Bindings mapped to cross-platform gesture inputs
function mapTouch(id, targetKey) {
    const target = document.getElementById(id);
    target.addEventListener('touchstart', (e) => { e.preventDefault(); keys[targetKey] = true; if(navigator.vibrate) navigator.vibrate(10); }, {passive: false});
    target.addEventListener('touchend', (e) => { e.preventDefault(); keys[targetKey] = false; }, {passive: false});
}
mapTouch('btn-left', 'ArrowLeft');
mapTouch('btn-right', 'ArrowRight');
mapTouch('btn-gas', 'ArrowUp');
mapTouch('btn-brake', 'ArrowDown');
mapTouch('btn-nitro', 'Shift');

// Auto Adjust Layout Constraints upon Dynamic Window Mutation
window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Adapt standard FOV matrix depending on the active Aspect Ratio (9:16 vs 16:9)
    fov = (width < height) ? 120 : 95; 
    cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);
});
window.dispatchEvent(new Event('resize'));

// UI Interfacings
const uiScore = document.getElementById('ui-score');
const uiHighScore = document.getElementById('ui-highscore');
const uiSpeed = document.getElementById('ui-speed');
const uiNitro = document.getElementById('ui-nitro');
const mainMenu = document.getElementById('main-menu');
const gameOverMenu = document.getElementById('game-over-menu');

document.getElementById('menu-highscore').innerText = `BEST ATTAINED: ${Math.floor(highScore)}`;
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

/**
 * RASTER PROJECTION MATHEMATICAL TRANSLATION
 */
function project(point, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    point.camera.x = (point.world.x || 0) - cameraX;
    point.camera.y = (point.world.y || 0) - cameraY;
    point.camera.z = (point.world.z || 0) - cameraZ;
    point.screen.scale = cameraDepth / point.camera.z;
    point.screen.x = Math.round((width / 2) + (point.screen.scale * point.camera.x * width / 2));
    point.screen.y = Math.round((height / 2) - (point.screen.scale * point.camera.y * height / 2));
    point.screen.w = Math.round((point.screen.scale * roadWidth * width / 2));
}

function resetTrack() {
    track = [];
    traffic = [];
    const totalSegments = 2500;
    
    // Procedural track architecture
    for (let i = 0; i < totalSegments; i++) {
        let curve = 0;
        let y = 0;
        
        if (i > 150 && i < 350) curve = 1.8;
        if (i > 500 && i < 750) curve = -2.3;
        if (i > 900 && i < 1200) { curve = 1.2; y = Math.sin(i / 25) * 900; }
        if (i > 1400 && i < 1800) { curve = -3; y = Math.cos(i / 15) * 1400; }

        track.push({
            index: i,
            p1: { world: { x: 0, y: 0, z: i * segmentLength }, camera: {}, screen: {} },
            p2: { world: { x: 0, y: 0, z: (i + 1) * segmentLength }, camera: {}, screen: {} },
            curve: curve,
            color: Math.floor(i / rumbleLength) % 2 ? 
                { road: '#0d0d16', grass: '#03030a', rumble: '#ff00ff', lane: '#0d0d16' } : 
                { road: '#141424', grass: '#050512', rumble: '#00ffff', lane: '#ffffff' }
        });
    }

    // Connect vertical elevation points smoothly
    for (let i = 1; i < totalSegments; i++) {
        track[i].p1.world.y = track[i - 1].p2.world.y;
    }
    trackLength = track.length * segmentLength;

    // Populate Traffic with different cars across varied paths
    let colors = ['#ff2233', '#ff9900', '#ffff00', '#00ff55', '#0088ff', '#bb00ff'];
    for (let j = 100; j < totalSegments - 100; j += 32) {
        if (Math.random() > 0.45) {
            traffic.push({
                offset: (Math.random() * 1.6) - 0.8, // Positioned on track lane matrix
                z: j * segmentLength,
                speed: maxSpeed * (0.22 + Math.random() * 0.25),
                color: colors[Math.floor(Math.random() * colors.length)],
                widthFactor: 180 + Math.random() * 60,
                typeShift: Math.random() > 0.5 ? 1 : 0.75
            });
        }
    }
}

function findSegment(z) {
    return track[Math.floor(z / segmentLength) % track.length];
}

/**
 * RENDERING ENGINES
 */
function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function renderBackground(ctx) {
    // Dynamic Horizon Space Rendering
    let gradient = ctx.createLinearGradient(0, 0, 0, height * 0.6);
    gradient.addColorStop(0, '#020208');
    gradient.addColorStop(0.4, '#0f051d');
    gradient.addColorStop(1, '#a30046');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    // Cyberpunk Neon Grid Elements
    ctx.strokeStyle = 'rgba(255, 0, 255, 0.08)';
    ctx.lineWidth = 1.5;
    let horizonY = height / 2;
    for (let i = 0; i < 12; i++) {
        let y = horizonY * (i / 12);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
    }
}

function drawCarSprite(ctx, x, y, scale, color, widthFactor, typeShift, turnValue, isPlayer) {
    let w = widthFactor * scale * (width / 1000);
    let h = (widthFactor * 0.45) * scale * (width / 1000) * typeShift;
    x = x - w / 2;
    y = y - h;

    // Contact Ambient Occlusion Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x - w*0.05, y + h - 4, w * 1.1, 12);

    // Chassis base
    ctx.fillStyle = color;
    ctx.fillRect(x, y + h * 0.35, w, h * 0.65);
    
    // Cabin Pillar Structure
    ctx.fillStyle = '#06060c';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.18, y + h * 0.35);
    ctx.lineTo(x + w * 0.28, y);
    ctx.lineTo(x + w * 0.72, y);
    ctx.lineTo(x + w * 0.82, y + h * 0.35);
    ctx.closePath();
    ctx.fill();

    // Windshield accents
    ctx.fillStyle = '#00ffff';
    ctx.globalAlpha = 0.3;
    ctx.fillRect(x + w * 0.3, y + h * 0.08, w * 0.4, h * 0.22);
    ctx.globalAlpha = 1.0;
    
    // Tail Warning Lighting Modules
    ctx.fillStyle = (keys.ArrowDown && isPlayer) ? '#ff0033' : '#660011';
    ctx.fillRect(x + w * 0.06, y + h * 0.45, w * 0.16, h * 0.15);
    ctx.fillRect(x + w * 0.78, y + h * 0.45, w * 0.16, h * 0.15);

    // Dynamic Tire Track Alignments
    ctx.fillStyle = '#010103';
    let steerOffset = turnValue * w * 0.08;
    ctx.fillRect(x + steerOffset, y + h * 0.75, w * 0.18, h * 0.3);
    ctx.fillRect(x + w * 0.82 + steerOffset, y + h * 0.75, w * 0.18, h * 0.3);

    // High Velocity Particle Discharge (Nitro Mode)
    if (isPlayer && isNitro) {
        let flr = Math.random() * 22 * scale;
        ctx.fillStyle = '#00ffff';
        ctx.beginPath(); ctx.arc(x + w*0.25, y + h*0.8, flr, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w*0.75, y + h*0.8, flr, 0, Math.PI*2); ctx.fill();
    }
}

function updateEngineState(dt) {
    if (gameState !== 'playing') return;

    const currentSegment = findSegment(playerZ);
    const speedRatio = speed / maxSpeed;
    let turnFactor = dt * 2.2 * Math.max(0.3, speedRatio);

    // Steer Input Vectoring
    if (keys.ArrowLeft) playerX -= turnFactor;
    if (keys.ArrowRight) playerX += turnFactor;

    // Centrifugal curve drift offset calculation
    playerX -= (turnFactor * speedRatio * currentSegment.curve * 2.5);

    // Dynamic Engine Accelerations & Boost Matrices
    isNitro = keys.Shift && nitro > 0;
    let activeAcceleration = accel;
    let activeTopSpeed = maxSpeed;

    if (isNitro) {
        activeAcceleration *= 1.8;
        activeTopSpeed *= 1.35;
        nitro = Math.max(0, nitro - dt * 32);
    } else {
        if (nitro < 100) nitro += dt * 8;
    }

    if (keys.ArrowUp) {
        speed += activeAcceleration * dt;
    } else if (keys.ArrowDown) {
        speed += braking * dt;
    } else {
        speed += decel * dt;
    }

    // Boundary Track Clamp Constraints
    if ((playerX < -1 || playerX > 1) && speed > (maxSpeed * 0.25)) {
        speed += (decel * 2.5) * dt; // Slow down on grass/sand edge matrix
    }

    speed = Math.max(0, Math.min(speed, activeTopSpeed));
    playerZ += speed * dt;

    if (playerZ >= trackLength) playerZ -= trackLength;

    // Realtime Audio updates
    audio.updateEngine(speed / maxSpeed, isNitro);

    // Traffic Sim Mapping & Bound Computations
    for (let i = 0; i < traffic.length; i++) {
        let car = traffic[i];
        car.z += car.speed * dt;
        if (car.z >= trackLength) car.z -= trackLength;

        // Bounding Volume Collision Detection Check
        if (car.z > playerZ && car.z < playerZ + 260) {
            let spaceX = Math.abs(playerX - car.offset);
            let spaceZ = car.z - playerZ;
            if (spaceX < 0.58 && spaceZ < segmentLength * 1.1) {
                // Terminate Session due to crash impact
                speed = 0;
                audio.triggerCrashSound();
                if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
                gameState = 'gameover';
                document.getElementById('final-score').innerText = Math.floor(score);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('velocityApexHigh', highScore);
                }
                gameOverMenu.classList.remove('hidden');
                return;
            }
        }
    }

    score += (speed / maxSpeed) * dt * 140;

    // Fast HTML Component Interfacing
    uiScore.innerText = Math.floor(score);
    uiSpeed.innerText = Math.floor((speed / maxSpeed) * 320);
    uiNitro.style.width = `${nitro}%`;
}

function drawSceneGraph() {
    ctx.clearRect(0, 0, width, height);

    const baseSegment = findSegment(playerZ);
    const startPercent = (playerZ % segmentLength) / segmentLength;

    // Variable field of view zoom scaling depending on your velocity path
    let velocityFOVModifier = 1 + ((speed / maxSpeed) * 0.12);
    let activeCameraDepth = cameraDepth * velocityFOVModifier;

    const camZ = playerZ;
    let baseCamY = baseSegment.p1.world.y + (baseSegment.p2.world.y - baseSegment.p1.world.y) * startPercent;
    const camY = baseCamY + cameraHeight;

    renderBackground(ctx);

    let maxClipY = height;
    let xMultiplier = 0;
    let deltaX = 0;

    // Projection Loop for Core Pseudo-3D Ground Tracks
    for (let n = 0; n < drawDistance; n++) {
        const segment = track[(baseSegment.index + n) % track.length];
        segment.looped = segment.index < baseSegment.index;

        xMultiplier += deltaX;
        deltaX += segment.curve;

        project(segment.p1, (playerX * roadWidth) - xMultiplier, camY, camZ - (segment.looped ? trackLength : 0), activeCameraDepth, width, height, roadWidth);
        project(segment.p2, (playerX * roadWidth) - xMultiplier - deltaX, camY, camZ - (segment.looped ? trackLength : 0), activeCameraDepth, width, height, roadWidth);

        if (segment.p1.camera.z <= activeCameraDepth || segment.p2.screen.y >= maxClipY) continue;

        // Render polygons
        drawPolygon(ctx, 0, segment.p1.screen.y, width, segment.p1.screen.y, width, segment.p2.screen.y, 0, segment.p2.screen.y, segment.color.grass);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w * 1.15, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w * 1.15, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w * 1.15, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w * 1.15, segment.p2.screen.y, segment.color.rumble);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w, segment.color.road);

        maxClipY = segment.p1.screen.y;
    }

    // Secondary Depth Loop to draw Traffic Cars and Player Object from Back to Front
    for (let n = drawDistance - 1; n > 0; n--) {
        const segment = track[(baseSegment.index + n) % track.length];

        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            let carSegment = findSegment(car.z);
            if (carSegment.index === segment.index) {
                let scale = segment.p1.screen.scale;
                let carX = segment.p1.screen.x + (scale * car.offset * roadWidth * width / 2);
                let carY = segment.p1.screen.y;
                drawCarSprite(ctx, carX, carY, scale, car.color, car.widthFactor, car.typeShift, 0, false);
            }
        }

        // Draw Player Car layer plane when index meets the chase distance point
        if (n === 12) {
            let playerScale = activeCameraDepth / (segmentLength * 12);
            let pX = width / 2;
            
            // Adjust baseline rendering target layout automatically based on screen proportions
            let pY = (width < height) ? (height * 0.82) : (height - 40);
            let steerDirection = (keys.ArrowLeft ? -1 : keys.ArrowRight ? 1 : 0);
            
            drawCarSprite(ctx, pX, pY, playerScale * 0.72, '#ffffff', 210, 0.9, steerDirection, true);
        }
    }
}

/**
 * LIFECYCLE EVENT CONTROLLERS
 */
function runHeartbeat(time) {
    if (gameState === 'playing') {
        let dt = (time - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1; // Cap time variations during system stutters
        updateEngineState(dt);
        drawSceneGraph();
    }
    lastTime = time;
    animationFrameId = requestAnimationFrame(runHeartbeat);
}

function startGame() {
    audio.init(); // Mount dynamic audio engine seamlessly upon interaction
    
    mainMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');
    
    playerX = 0;
    playerZ = 0;
    speed = 0;
    score = 0;
    nitro = 100;
    
    resetTrack();
    gameState = 'playing';
    lastTime = performance.now();
    cancelAnimationFrame(animationFrameId);
    runHeartbeat(lastTime);
}

// Initial Canvas State Render
resetTrack();
drawSceneGraph();
</script>
