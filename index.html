<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Racing Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Overlays */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; padding-top: max(10px, env(safe-area-inset-top)); }
        
        .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(10,15,25,0.95), rgba(0,0,5,0.95)); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 20; backdrop-filter: blur(10px); text-align: center; padding: 20px; }
        .hidden { display: none !important; }
        
        h1 { color: #fff; font-size: 3rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; text-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        h2 { color: #4CAF50; font-size: 1.2rem; margin-bottom: 30px; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        /* Difficulty Selector */
        .diff-container { display: flex; gap: 10px; margin-bottom: 30px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .diff-btn { background: transparent; border: 2px solid transparent; padding: 10px 20px; color: #888; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .diff-btn.active { color: #fff; border-color: #2196F3; background: rgba(33, 150, 243, 0.2); box-shadow: 0 0 15px rgba(33, 150, 243, 0.3); }

        .start-btn { background: #2196F3; border: none; padding: 18px 50px; color: #fff; font-size: 1.4rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 20px rgba(33, 150, 243, 0.5); transition: transform 0.1s; text-transform: uppercase; letter-spacing: 1px; }
        .start-btn:active { transform: scale(0.95); }

        /* HUD Styling */
        .hud-top { display: flex; justify-content: space-between; width: 100%; padding: 15px; pointer-events: none; }
        .hud-card { background: rgba(20, 25, 30, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 20px; border-radius: 15px; color: #fff; font-weight: bold; font-size: 1rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .speedometer { font-size: 2.2rem; color: #fff; font-style: italic; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
        .stats-row { display: flex; gap: 20px; margin-bottom: 5px; font-size: 1.2rem; }

        /* Mobile Controls */
        .mobile-controls { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 20px; padding-bottom: max(30px, env(safe-area-inset-bottom)); pointer-events: auto; }
        .control-block { display: flex; gap: 15px; }
        
        .touch-btn { width: 75px; height: 75px; background: rgba(30, 35, 40, 0.9); border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 50%; color: #fff; font-size: 28px; display: flex; justify-content: center; align-items: center; font-weight: bold; -webkit-tap-highlight-color: transparent; box-shadow: 0 6px 15px rgba(0,0,0,0.6); transition: border-color 0.1s; }
        .touch-btn:active { background: rgba(255, 255, 255, 0.95); color: #000; border-color: #fff; }
        
        .btn-gas { background: rgba(46, 125, 50, 0.9); border-color: rgba(76, 175, 80, 0.5); }
        .btn-gas:active { background: #4CAF50; color: #fff; border-color: #81C784; }
        .btn-brake { background: rgba(198, 40, 40, 0.9); border-color: rgba(244, 67, 54, 0.5); }
        .btn-brake:active { background: #F44336; color: #fff; border-color: #E57373; }

        /* Responsive scaling */
        @media(orientation: portrait) {
            h1 { font-size: 2.2rem; }
            .touch-btn { width: 65px; height: 65px; font-size: 24px; }
            .speedometer { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer hidden" id="hud">
        <div class="hud-top">
            <div class="hud-card">
                <div class="stats-row">
                    <span>❤️ <span id="ui-lives">3</span></span>
                    <span>🪙 <span id="ui-coins">0</span></span>
                </div>
                <div style="color: #4CAF50; font-size: 14px; margin-top: 5px; text-transform: uppercase;">SCORE: <span id="ui-score">0</span></div>
            </div>
            <div class="hud-card" style="text-align: right;">
                <div class="speedometer"><span id="ui-speed">0</span> KM/H</div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="control-block">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="control-block">
                <div class="touch-btn btn-brake" id="btn-brake">B</div>
                <div class="touch-btn btn-gas" id="btn-gas">G</div>
            </div>
        </div>
    </div>

    <div class="menu" id="main-menu">
        <h1>PRO RACING</h1>
        <h2 id="menu-highscore">HIGH SCORE: 0</h2>
        
        <div class="diff-container">
            <button class="diff-btn" data-level="easy">EASY</button>
            <button class="diff-btn active" data-level="medium">MEDIUM</button>
            <button class="diff-btn" data-level="hard">HARD</button>
        </div>

        <button class="start-btn" id="start-btn">RACE NOW</button>
        <p style="color: #666; margin-top: 25px; font-size: 0.9rem;">
            Desktop: Arrows to Steer | Up/Down for Gas/Brake
        </p>
    </div>

    <div class="menu hidden" id="game-over-menu">
        <h1 style="color: #F44336; font-size: 3.5rem;">CRASHED</h1>
        <div style="color: #fff; font-size: 1.5rem; margin: 20px 0;">Final Score: <span id="final-score" style="color: #4CAF50; font-weight: bold;">0</span></div>
        <button class="start-btn" id="restart-btn">TRY AGAIN</button>
    </div>
</div>

<script>
/**
 * GRAPHICS CORE & PHYSICS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

let gameState = 'menu';
let lastTime = 0;
let animationFrameId;

// Game Settings
let currentDifficulty = 'medium';
const diffSettings = {
    easy: { maxSpeedMult: 0.85, trafficDensity: 60, trafficSpeedMult: 0.2 },
    medium: { maxSpeedMult: 1.0, trafficDensity: 35, trafficSpeedMult: 0.35 },
    hard: { maxSpeedMult: 1.2, trafficDensity: 20, trafficSpeedMult: 0.5 }
};

// Environment Constants
const roadWidth = 2000;
const segmentLength = 200;
const rumbleLength = 3;
const drawDistance = 250; 
let fov = 100;
const cameraHeight = 1100;
let cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);

// Player Setup
let playerX = 0;
let playerZ = 0;
let speed = 0;
const baseMaxSpeed = segmentLength / (1/60); 
let activeMaxSpeed = baseMaxSpeed;

let accel = activeMaxSpeed / 5;
let braking = -activeMaxSpeed * 0.9;
let decel = -activeMaxSpeed / 8;

let lives = 3;
let coinsCollected = 0;
let score = 0;
let highScore = localStorage.getItem('proRacingHighScore') || 0;
let invulnTimer = 0;
let floatingTexts = [];

let track = [];
let trackLength = 0;
let traffic = [];

// Input Management
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

// Fullscreen API Helper
function requestFullScreen() {
    let elem = document.documentElement;
    try {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    } catch (e) { console.log("Fullscreen blocked by browser"); }
}

// Touch Controls
function mapTouch(id, targetKey) {
    const target = document.getElementById(id);
    target.addEventListener('touchstart', (e) => { e.preventDefault(); keys[targetKey] = true; if(navigator.vibrate) navigator.vibrate(15); }, {passive: false});
    target.addEventListener('touchend', (e) => { e.preventDefault(); keys[targetKey] = false; }, {passive: false});
}
mapTouch('btn-left', 'ArrowLeft');
mapTouch('btn-right', 'ArrowRight');
mapTouch('btn-gas', 'ArrowUp');
mapTouch('btn-brake', 'ArrowDown');

// Responsive Scaling
window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    fov = (width < height) ? 115 : 90; 
    cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);
});
window.dispatchEvent(new Event('resize'));

// UI Elements
const uiScore = document.getElementById('ui-score');
const uiSpeed = document.getElementById('ui-speed');
const uiLives = document.getElementById('ui-lives');
const uiCoins = document.getElementById('ui-coins');
const mainMenu = document.getElementById('main-menu');
const gameOverMenu = document.getElementById('game-over-menu');
const hud = document.getElementById('hud');

document.getElementById('menu-highscore').innerText = `HIGH SCORE: ${Math.floor(highScore)}`;

// Difficulty Selector Logic
document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentDifficulty = e.target.getAttribute('data-level');
        if(navigator.vibrate) navigator.vibrate(10);
    });
});

document.getElementById('start-btn').addEventListener('click', () => { requestFullScreen(); startGame(); });
document.getElementById('restart-btn').addEventListener('click', () => { requestFullScreen(); startGame(); });

function project(point, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    point.camera.x = (point.world.x || 0) - cameraX;
    point.camera.y = (point.world.y || 0) - cameraY;
    point.camera.z = (point.world.z || 0) - cameraZ;
    point.screen.scale = cameraDepth / point.camera.z;
    point.screen.x = Math.round((width / 2) + (point.screen.scale * point.camera.x * width / 2));
    point.screen.y = Math.round((height / 2) - (point.screen.scale * point.camera.y * height / 2));
    point.screen.w = Math.round((point.screen.scale * roadWidth * width / 2));
}

function resetTrack() {
    track = [];
    traffic = [];
    floatingTexts = [];
    const totalSegments = 3000;
    
    // Apply Difficulty Settings
    let settings = diffSettings[currentDifficulty];
    activeMaxSpeed = baseMaxSpeed * settings.maxSpeedMult;
    accel = activeMaxSpeed / 5;
    braking = -activeMaxSpeed * 0.9;
    decel = -activeMaxSpeed / 8;
    
    // Track Generation
    for (let i = 0; i < totalSegments; i++) {
        let curve = 0, y = 0;
        
        if (i > 100 && i < 300) curve = 2.5;
        if (i > 500 && i < 800) curve = -3.0;
        if (i > 1000 && i < 1400) { curve = 1.8; y = Math.sin(i / 25) * 1200; }
        if (i > 1700 && i < 2200) { curve = -2.2; y = Math.cos(i / 15) * 1600; }

        track.push({
            index: i,
            p1: { world: { x: 0, y: 0, z: i * segmentLength }, camera: {}, screen: {} },
            p2: { world: { x: 0, y: 0, z: (i + 1) * segmentLength }, camera: {}, screen: {} },
            curve: curve,
            color: Math.floor(i / rumbleLength) % 2 ? 
                { road: '#4f5052', grass: '#2e7d32', rumble: '#ffffff', lane: '#ffffff' } : 
                { road: '#3e3f41', grass: '#1b5e20', rumble: '#d32f2f', lane: '#3e3f41' },
            coin: (Math.random() > 0.94) ? { x: (Math.random() * 1.6) - 0.8, active: true } : null
        });
    }
    for (let i = 1; i < totalSegments; i++) track[i].p1.world.y = track[i - 1].p2.world.y;
    trackLength = track.length * segmentLength;

    // Traffic Generation
    let carColors = ['#F44336', '#2196F3', '#FF9800', '#9C27B0', '#FFFFFF', '#00BCD4', '#111111'];
    for (let j = 100; j < totalSegments - 100; j += settings.trafficDensity) {
        if (Math.random() > 0.3) {
            traffic.push({
                offset: (Math.random() * 1.6) - 0.8,
                z: j * segmentLength,
                speed: activeMaxSpeed * (settings.trafficSpeedMult + Math.random() * 0.2),
                color: carColors[Math.floor(Math.random() * carColors.length)]
            });
        }
    }
}

function findSegment(z) {
    let index = Math.floor(z / segmentLength) % track.length;
    if (index < 0) index += track.length; 
    return track[index];
}

function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function renderBackground(ctx) {
    let gradient = ctx.createLinearGradient(0, 0, 0, height * 0.6);
    gradient.addColorStop(0, '#2b5876'); // Deep sky blue
    gradient.addColorStop(1, '#4e4376'); // Sunrise horizon
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
}

// Highly Realistic Car Rendering function
function drawRealisticCar(ctx, x, y, w, h, baseColor, turnValue, isPlayer) {
    x = x - w / 2;
    y = y - h;

    // Soft drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h, w*0.6, h*0.2, 0, 0, Math.PI*2);
    ctx.fill();

    let steerOffset = turnValue * w * 0.15;
    
    // Tires (Wide racing tires)
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(x + steerOffset, y + h * 0.6, w * 0.22, h * 0.4);
    ctx.fillRect(x + w * 0.78 + steerOffset, y + h * 0.6, w * 0.22, h * 0.4);

    // Rim Details
    ctx.fillStyle = '#666';
    ctx.fillRect(x + steerOffset + w*0.05, y + h*0.7, w*0.12, h*0.2);
    ctx.fillRect(x + w*0.78 + steerOffset + w*0.05, y + h*0.7, w*0.12, h*0.2);

    // Main Body Gradient (Metallic look)
    let bodyGrad = ctx.createLinearGradient(x, y, x + w, y);
    bodyGrad.addColorStop(0, '#111'); // dark edge
    bodyGrad.addColorStop(0.2, baseColor); // main color
    bodyGrad.addColorStop(0.8, baseColor);
    bodyGrad.addColorStop(1, '#111'); // dark edge
    
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(x, y + h*0.75); // Bottom left
    ctx.lineTo(x + w*0.1, y + h*0.35); // Mid left
    ctx.lineTo(x + w*0.9, y + h*0.35); // Mid right
    ctx.lineTo(x + w, y + h*0.75); // Bottom right
    ctx.closePath();
    ctx.fill();
    
    // Rear Bumper Grille / Diffuser
    ctx.fillStyle = '#151515';
    ctx.fillRect(x + w*0.15, y + h*0.75, w*0.7, h*0.15);
    
    // Exhaust Pipes
    ctx.fillStyle = '#aaa';
    ctx.beginPath(); ctx.arc(x + w*0.25, y + h*0.82, w*0.04, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w*0.75, y + h*0.82, w*0.04, 0, Math.PI*2); ctx.fill();

    // Roof & Cabin
    let roofGrad = ctx.createLinearGradient(x, y, x, y + h);
    roofGrad.addColorStop(0, '#222');
    roofGrad.addColorStop(1, '#000');
    ctx.fillStyle = roofGrad;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.2, y + h * 0.35);
    ctx.lineTo(x + w * 0.3, y);
    ctx.lineTo(x + w * 0.7, y);
    ctx.lineTo(x + w * 0.8, y + h * 0.35);
    ctx.closePath();
    ctx.fill();

    // Rear Windshield (with fake environment reflection)
    let glassGrad = ctx.createLinearGradient(x, y, x, y + h*0.35);
    glassGrad.addColorStop(0, '#4e4376'); // reflects horizon
    glassGrad.addColorStop(1, '#111');
    ctx.fillStyle = glassGrad;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.25, y + h * 0.3);
    ctx.lineTo(x + w * 0.32, y + h * 0.05);
    ctx.lineTo(x + w * 0.68, y + h * 0.05);
    ctx.lineTo(x + w * 0.75, y + h * 0.3);
    ctx.closePath();
    ctx.fill();
    
    // Taillights (Glowing)
    let isBraking = keys.ArrowDown && isPlayer;
    ctx.fillStyle = isBraking ? '#ff3333' : '#8b0000';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = isBraking ? 15 : 0;
    ctx.fillRect(x + w * 0.05, y + h * 0.45, w * 0.25, h * 0.15);
    ctx.fillRect(x + w * 0.7, y + h * 0.45, w * 0.25, h * 0.15);
    ctx.shadowBlur = 0; // reset shadow
    
    // Spoiler
    ctx.fillStyle = '#111';
    ctx.fillRect(x + w*0.05, y + h*0.25, w*0.9, h*0.08); // Wing
    ctx.fillRect(x + w*0.2, y + h*0.33, w*0.05, h*0.1); // Strut Left
    ctx.fillRect(x + w*0.75, y + h*0.33, w*0.05, h*0.1); // Strut Right

    // License Plate
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + w * 0.4, y + h * 0.55, w * 0.2, h * 0.12);
}

function drawCoin(ctx, x, y, r) {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(x, y - r, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = Math.max(1, r * 0.1);
    ctx.stroke();
    ctx.fillStyle = '#DAA520';
    ctx.beginPath(); ctx.arc(x, y - r, r * 0.6, 0, Math.PI * 2); ctx.fill();
}

function updateEngineState(dt) {
    if (gameState !== 'playing') return;

    const currentSegment = findSegment(playerZ);
    const speedRatio = speed / activeMaxSpeed;
    
    let turnFactor = dt * 3.5 * Math.max(0.3, speedRatio);

    if (keys.ArrowLeft) playerX -= turnFactor;
    if (keys.ArrowRight) playerX += turnFactor;
    
    // Centrifugal curve drift
    playerX -= (turnFactor * speedRatio * currentSegment.curve * 1.5);

    // Hard Boundaries
    playerX = Math.max(-1.0, Math.min(1.0, playerX));

    // Acceleration Logic
    if (keys.ArrowUp) speed += accel * dt;
    else if (keys.ArrowDown) speed += braking * dt;
    else speed += decel * dt;

    speed = Math.max(0, Math.min(speed, activeMaxSpeed));
    playerZ += speed * dt;
    if (playerZ >= trackLength) playerZ -= trackLength;

    // Detect Coin Pickup
    if (currentSegment.coin && currentSegment.coin.active) {
        if (Math.abs(playerX - currentSegment.coin.x) < 0.35) { // Accurate hitbox
            currentSegment.coin.active = false;
            coinsCollected++;
            score += 500;
            if (navigator.vibrate) navigator.vibrate(20);
            
            // Spawn Floating Text Animation
            floatingTexts.push({
                x: width/2, y: height/2 + 50, alpha: 1.0, text: '+500'
            });
        }
    }

    // Traffic Collision
    if (invulnTimer > 0) {
        invulnTimer -= dt;
    } else {
        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            car.z += car.speed * dt;
            if (car.z >= trackLength) car.z -= trackLength;

            if (car.z > playerZ && car.z < playerZ + 180) {
                // TIGHTENED ACCURATE HITBOX (matches visual width perfectly)
                let spaceX = Math.abs(playerX - car.offset);
                let spaceZ = car.z - playerZ;
                
                if (spaceX < 0.45 && spaceZ < segmentLength * 0.9) {
                    lives--;
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    
                    if (lives <= 0) {
                        speed = 0;
                        gameState = 'gameover';
                        document.getElementById('final-score').innerText = Math.floor(score);
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('proRacingHighScore', highScore);
                        }
                        hud.classList.add('hidden');
                        gameOverMenu.classList.remove('hidden');
                        
                        // Exit fullscreen safely on game over if supported
                        if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                        return;
                    } else {
                        speed = activeMaxSpeed * 0.3; 
                        invulnTimer = 2.0; 
                    }
                }
            }
        }
    }

    // Update Floating Texts
    for(let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 200 * dt; // Float up
        ft.alpha -= 1.0 * dt; // Fade out over 1 sec
        if(ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    score += (speed / activeMaxSpeed) * dt * 100;
    
    uiScore.innerText = Math.floor(score);
    // Dynamic KM/H relative to difficulty multiplier
    uiSpeed.innerText = Math.floor((speed / activeMaxSpeed) * 250); 
    uiLives.innerText = lives;
    uiCoins.innerText = coinsCollected;
}

function drawSceneGraph() {
    ctx.fillStyle = '#2b5876'; 
    ctx.fillRect(0, 0, width, height);

    const baseSegment = findSegment(playerZ);
    const startPercent = (playerZ % segmentLength) / segmentLength;
    const camZ = playerZ;
    let baseCamY = baseSegment.p1.world.y + (baseSegment.p2.world.y - baseSegment.p1.world.y) * startPercent;
    const camY = baseCamY + cameraHeight;

    renderBackground(ctx);

    let maxClipY = height, xMultiplier = 0, deltaX = 0;

    // Polygons (Front to Back)
    for (let n = 0; n < drawDistance; n++) {
        const segment = track[(baseSegment.index + n) % track.length];
        segment.looped = segment.index < baseSegment.index;

        xMultiplier += deltaX;
        deltaX += segment.curve;

        project(segment.p1, (playerX * roadWidth) - xMultiplier, camY, camZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);
        project(segment.p2, (playerX * roadWidth) - xMultiplier - deltaX, camY, camZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);

        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= maxClipY) continue;

        drawPolygon(ctx, 0, segment.p1.screen.y, width, segment.p1.screen.y, width, segment.p2.screen.y, 0, segment.p2.screen.y, segment.color.grass);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w * 1.1, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w * 1.1, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w * 1.1, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w * 1.1, segment.p2.screen.y, segment.color.rumble);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w, segment.p2.screen.y, segment.color.road);

        if (segment.color.lane === '#ffffff') {
            let laneW1 = segment.p1.screen.w * 0.02;
            let laneW2 = segment.p2.screen.w * 0.02;
            drawPolygon(ctx, segment.p1.screen.x - laneW1, segment.p1.screen.y, segment.p1.screen.x + laneW1, segment.p1.screen.y, segment.p2.screen.x + laneW2, segment.p2.screen.y, segment.p2.screen.x - laneW2, segment.p2.screen.y, segment.color.lane);
        }
        maxClipY = segment.p1.screen.y;
    }

    // Sprites (Back to Front)
    for (let n = drawDistance - 1; n > 0; n--) {
        const segment = track[(baseSegment.index + n) % track.length];

        if (segment.coin && segment.coin.active) {
            let coinX = segment.p1.screen.x + (segment.coin.x * segment.p1.screen.w);
            let coinR = 0.15 * segment.p1.screen.w; 
            drawCoin(ctx, coinX, segment.p1.screen.y, coinR);
        }

        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            let carSegment = findSegment(car.z);
            if (carSegment.index === segment.index) {
                let carX = segment.p1.screen.x + (car.offset * segment.p1.screen.w);
                let carW = 0.8 * segment.p1.screen.w; 
                let carH = carW * 0.45; 
                drawRealisticCar(ctx, carX, segment.p1.screen.y, carW, carH, car.color, 0, false);
            }
        }
    }

    // Draw Player Car
    if (invulnTimer <= 0 || Math.floor(invulnTimer * 10) % 2 === 0) {
        let pW = width < height ? width * 0.45 : width * 0.22; 
        let pH = pW * 0.45;
        let pX = width / 2;
        let pY = height - (width < height ? 180 : 80); 
        let steerDirection = (keys.ArrowLeft ? -1 : keys.ArrowRight ? 1 : 0);
        
        drawRealisticCar(ctx, pX, pY, pW, pH, '#ff3300', steerDirection, true); // Player is red sports car
    }

    // Render Floating Animations (Coins)
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    for(let ft of floatingTexts) {
        ctx.fillStyle = `rgba(255, 215, 0, ${ft.alpha})`; // Gold color
        ctx.fillText(ft.text, ft.x, ft.y);
    }
}

function runHeartbeat(time) {
    if (gameState === 'playing') {
        let dt = (time - lastTime) / 1000;
        if (dt < 0) dt = 0; 
        if (dt > 0.1) dt = 0.1; 
        
        updateEngineState(dt);
        drawSceneGraph();
    }
    lastTime = time;
    animationFrameId = requestAnimationFrame(runHeartbeat);
}

function startGame() {
    mainMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');
    hud.classList.remove('hidden');
    
    playerX = 0;
    playerZ = 0;
    speed = 0;
    score = 0;
    lives = 3;
    coinsCollected = 0;
    invulnTimer = 0;
    floatingTexts = [];
    
    resetTrack();
    gameState = 'playing';
    
    cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame((time) => {
        lastTime = time;
        runHeartbeat(time);
    });
}

// Initial draw
resetTrack();
drawSceneGraph();
</script>
</body>
