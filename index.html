<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>City Driving Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #87CEEB; overflow: hidden; font-family: 'Arial', sans-serif; touch-action: none; }
        
        #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; padding-top: max(10px, env(safe-area-inset-top)); }
        
        /* Menus */
        .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 30, 40, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 20; backdrop-filter: blur(5px); text-align: center; padding: 20px; }
        .hidden { display: none !important; }
        
        h1 { color: #FFA500; font-size: 3.5rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 2px 4px 0px #000; }
        h2 { color: #FFF; font-size: 1.2rem; margin-bottom: 30px; font-weight: bold; }
        
        .start-btn { background: #FFA500; border: 4px solid #fff; padding: 15px 50px; color: #000; font-size: 1.5rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-transform: uppercase; }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 1px 5px rgba(0,0,0,0.5); }

        /* HUD elements */
        .hud-top { display: flex; justify-content: space-between; width: 100%; padding: 15px; pointer-events: none; }
        .hud-card { background: rgba(0, 0, 0, 0.6); border: 2px solid #FFA500; padding: 10px 20px; border-radius: 10px; color: #fff; font-weight: bold; font-size: 1.2rem; }
        .speedometer { font-size: 2.5rem; color: #FFA500; font-style: normal; text-shadow: 2px 2px 0 #000; }
        
        /* Dr Driving Style Controls */
        .mobile-controls { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 20px; padding-bottom: max(30px, env(safe-area-inset-bottom)); pointer-events: auto; }
        
        /* Steering Wheel */
        .steering-zone { width: 150px; height: 150px; position: relative; display: flex; justify-content: center; align-items: center; }
        .steering-wheel { width: 130px; height: 130px; border-radius: 50%; border: 15px solid #333; background: transparent; position: relative; box-shadow: inset 0 0 10px #000, 0 5px 15px rgba(0,0,0,0.5); transform: rotate(0deg); transition: transform 0.1s linear; }
        .steering-wheel::before { content: ''; position: absolute; top: 40%; left: -10px; right: -10px; height: 20%; background: #333; }
        .steering-wheel::after { content: ''; position: absolute; top: 50%; left: 40%; width: 20%; height: 50%; background: #333; }
        .center-horn { position: absolute; width: 40px; height: 40px; background: #555; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid #222; }

        /* Pedals */
        .pedal-block { display: flex; gap: 15px; align-items: flex-end; }
        .pedal { background: linear-gradient(#555, #222); border: 2px solid #777; border-radius: 5px; color: #fff; font-size: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: 0.1s; border-bottom: 8px solid #111; }
        .pedal:active { transform: translateY(5px); border-bottom: 3px solid #111; }
        
        .btn-brake { width: 70px; height: 60px; }
        .btn-gas { width: 60px; height: 100px; }

        @media(orientation: portrait) {
            h1 { font-size: 2.5rem; }
            .steering-wheel { width: 110px; height: 110px; }
            .btn-gas { height: 90px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer hidden" id="hud">
        <div class="hud-top">
            <div class="hud-card">
                <div>❤️ <span id="ui-lives">3</span> | 🪙 <span id="ui-coins">0</span></div>
                <div style="color: #FFA500; font-size: 16px; margin-top: 5px;">SCORE: <span id="ui-score">0</span></div>
            </div>
            <div class="hud-card" style="text-align: right;">
                <div class="speedometer"><span id="ui-speed">0</span> KM/H</div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="steering-zone" id="steer-area">
                <div class="steering-wheel" id="wheel-visual">
                    <div class="center-horn"></div>
                </div>
            </div>
            
            <div class="pedal-block">
                <div class="pedal btn-brake" id="btn-brake">B</div>
                <div class="pedal btn-gas" id="btn-gas">G</div>
            </div>
        </div>
    </div>

    <div class="menu" id="main-menu">
        <h1>CITY DRIVING</h1>
        <h2 id="menu-highscore">BEST SCORE: 0</h2>
        <button class="start-btn" id="start-btn">DRIVE</button>
        <p style="color: #ccc; margin-top: 25px; font-size: 0.9rem;">
            Swipe Wheel to Steer | Press G for Gas
        </p>
    </div>

    <div class="menu hidden" id="game-over-menu">
        <h1 style="color: #F44336;">CRASHED!</h1>
        <div style="color: #fff; font-size: 1.5rem; margin: 20px 0;">Final Score: <span id="final-score" style="color: #FFA500; font-weight: bold;">0</span></div>
        <button class="start-btn" id="restart-btn">TRY AGAIN</button>
    </div>
</div>

<script>
/**
 * GRAPHICS CORE & PHYSICS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

let gameState = 'menu';
let lastTime = 0;
let animationFrameId;

// City Environment Constants
const roadWidth = 2200;
const segmentLength = 200;
const rumbleLength = 3;
const drawDistance = 140; 
let fov = 100;
const cameraHeight = 1000; // Lower camera for City driving feel
let cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);

// Physics State (Slower, precision driving)
let playerX = 0;
let playerZ = 0;
let speed = 0;

let steerInput = 0; // -1 to 1 based on wheel rotation
let visualSteer = 0;

const activeMaxSpeed = segmentLength / (1/40); // Slower max speed
const accel = activeMaxSpeed / 4;
const braking = -activeMaxSpeed * 1.2;
const decel = -activeMaxSpeed / 6;

let lives = 3;
let coinsCollected = 0;
let score = 0;
let highScore = localStorage.getItem('cityDrivingHigh') || 0;
let invulnTimer = 0;

let track = [];
let trackLength = 0;
let traffic = [];
let buildings = [];

const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

// Steering Wheel Logic
const steerArea = document.getElementById('steer-area');
const wheelVisual = document.getElementById('wheel-visual');
let isSteering = false;
let startTouchX = 0;

steerArea.addEventListener('touchstart', (e) => {
    e.preventDefault();
    isSteering = true;
    startTouchX = e.touches[0].clientX;
});

steerArea.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isSteering) return;
    let currentX = e.touches[0].clientX;
    let diff = currentX - startTouchX;
    
    // Convert swipe distance to steering input (-1 to 1)
    steerInput = Math.max(-1, Math.min(1, diff / 80)); 
    wheelVisual.style.transform = `rotate(${steerInput * 90}deg)`;
});

steerArea.addEventListener('touchend', (e) => {
    e.preventDefault();
    isSteering = false;
    steerInput = 0;
    wheelVisual.style.transform = `rotate(0deg)`;
});

// Pedals
const btnGas = document.getElementById('btn-gas');
const btnBrake = document.getElementById('btn-brake');

btnGas.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowUp = true; });
btnGas.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowUp = false; });
btnBrake.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowDown = true; });
btnBrake.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowDown = false; });

// Keyboard Fallback
window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) { keys[e.key] = true; steerInput = keys.ArrowLeft ? -1 : keys.ArrowRight ? 1 : steerInput; }});
window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) { keys[e.key] = false; if(e.key==='ArrowLeft'||e.key==='ArrowRight') steerInput = 0; }});

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    fov = (width < height) ? 115 : 90; 
    cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);
});
window.dispatchEvent(new Event('resize'));

const uiScore = document.getElementById('ui-score');
const uiSpeed = document.getElementById('ui-speed');
const uiLives = document.getElementById('ui-lives');
const uiCoins = document.getElementById('ui-coins');
const mainMenu = document.getElementById('main-menu');
const gameOverMenu = document.getElementById('game-over-menu');
const hud = document.getElementById('hud');

document.getElementById('menu-highscore').innerText = `BEST SCORE: ${Math.floor(highScore)}`;

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

function project(point, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    point.camera.x = (point.world.x || 0) - cameraX;
    point.camera.y = (point.world.y || 0) - cameraY;
    point.camera.z = (point.world.z || 0) - cameraZ;
    point.screen.scale = cameraDepth / point.camera.z;
    point.screen.x = Math.round((width / 2) + (point.screen.scale * point.camera.x * width / 2));
    point.screen.y = Math.round((height / 2) - (point.screen.scale * point.camera.y * height / 2));
    point.screen.w = Math.round((point.screen.scale * roadWidth * width / 2));
}

function resetTrack() {
    track = [];
    traffic = [];
    const totalSegments = 2500;
    
    for (let i = 0; i < totalSegments; i++) {
        // City streets are usually sharper and flatter
        let curve = 0;
        if (i > 100 && i < 300) curve = 3.0; // Sharp right intersection
        if (i > 500 && i < 700) curve = -3.0; // Sharp left
        if (i > 1000 && i < 1300) curve = 1.5; 
        if (i > 1600 && i < 1900) curve = -2.0;

        track.push({
            index: i,
            p1: { world: { x: 0, y: 0, z: i * segmentLength }, camera: {}, screen: {} },
            p2: { world: { x: 0, y: 0, z: (i + 1) * segmentLength }, camera: {}, screen: {} },
            curve: curve,
            // Urban colors: Sidewalks, asphalt, yellow center lines
            color: Math.floor(i / rumbleLength) % 2 ? 
                { road: '#555', grass: '#888', rumble: '#ddd', lane: '#FFD700' } : 
                { road: '#444', grass: '#777', rumble: '#ccc', lane: '#444' },
            coin: (Math.random() > 0.95) ? { x: (Math.random() * 1.6) - 0.8, active: true } : null
        });
    }
    trackLength = track.length * segmentLength;

    // Traffic Cars
    let carColors = ['#FF0000', '#0000FF', '#FFA500', '#FFFFFF', '#333333'];
    for (let j = 100; j < totalSegments - 100; j += 40) {
        if (Math.random() > 0.3) {
            traffic.push({
                offset: (Math.random() > 0.5 ? 0.6 : -0.6), // Stay in lanes mostly
                z: j * segmentLength,
                speed: activeMaxSpeed * (0.3 + Math.random() * 0.2), // Slow city traffic
                color: carColors[Math.floor(Math.random() * carColors.length)]
            });
        }
    }
}

function findSegment(z) {
    let index = Math.floor(z / segmentLength) % track.length;
    if (index < 0) index += track.length; 
    return track[index];
}

function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill();
}

function renderCitySky(ctx) {
    // Light blue sky
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, width, height);

    // Flat City Skyline (Fake 2D Buildings)
    ctx.fillStyle = '#9aa';
    ctx.fillRect(0, height*0.4, width, height*0.2);
    ctx.fillStyle = '#788';
    for(let i=0; i<width; i+=80) {
        let h = Math.random() * 100 + 50;
        ctx.fillRect(i, height*0.5 - h, 70, h);
    }
}

// Boxy City Car Model
function drawCityCar(ctx, x, y, w, h, baseColor, turnValue, isPlayer) {
    x = x - w / 2;
    y = y - h;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.ellipse(x + w/2, y + h*0.9, w*0.55, h*0.2, 0, 0, Math.PI*2); ctx.fill();

    let steerOffset = turnValue * w * 0.2; 
    let tireW = w * 0.15;
    let tireH = h * 0.35;

    // Tires
    ctx.fillStyle = '#111';
    ctx.fillRect(x - tireW*0.1 + steerOffset, y + h*0.65, tireW, tireH);
    ctx.fillRect(x + w - tireW*0.9 + steerOffset, y + h*0.65, tireW, tireH);

    // Car Body (Boxier)
    ctx.fillStyle = baseColor;
    ctx.fillRect(x, y + h*0.4, w, h*0.4);
    
    // Windows/Cabin
    ctx.fillStyle = '#b0e0e6'; // light blue glass
    ctx.fillRect(x + w*0.1, y + h*0.05, w*0.8, h*0.35);
    
    // Roof
    ctx.fillStyle = baseColor;
    ctx.fillRect(x + w*0.15, y, w*0.7, h*0.05);

    // Taillights
    let isBraking = keys.ArrowDown && isPlayer;
    ctx.fillStyle = isBraking ? '#ff3333' : '#aa0000';
    ctx.fillRect(x + w * 0.05, y + h * 0.5, w * 0.2, h * 0.15);
    ctx.fillRect(x + w * 0.75, y + h * 0.5, w * 0.2, h * 0.15);

    // License Plate
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + w * 0.35, y + h * 0.6, w * 0.3, h * 0.15);
}

function drawCoin(ctx, x, y, r) {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(x, y - r, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = Math.max(1, r * 0.1); ctx.stroke();
}

function updateEngineState(dt) {
    if (gameState !== 'playing') return;

    const currentSegment = findSegment(playerZ);
    const speedRatio = speed / activeMaxSpeed;

    // Direct wheel mapping
    let instantTurnSpeed = 5.0;
    playerX += steerInput * dt * instantTurnSpeed * Math.max(0.2, speedRatio);
    
    // Visual steering follows the wheel
    if(!isSteering && keys.ArrowLeft === false && keys.ArrowRight === false) {
        wheelVisual.style.transform = `rotate(0deg)`;
    }
    
    // Less curve drift because city speeds are slower
    let curveDrift = dt * 1.5 * speedRatio * currentSegment.curve;
    playerX -= curveDrift;

    // Hard boundary (Sidewalk curbs)
    let isOffRoad = Math.abs(playerX) > 1.0;
    if (isOffRoad) {
        speed -= activeMaxSpeed * 0.8 * dt; // Hit the curb
        playerX = Math.max(-1.0, Math.min(1.0, playerX)); // Bounce off
        if(navigator.vibrate) navigator.vibrate(10); 
    } else {
        if (keys.ArrowUp) speed += accel * dt;
        else if (keys.ArrowDown) speed += braking * dt;
        else speed += decel * dt;
    }

    speed = Math.max(0, Math.min(speed, activeMaxSpeed));
    playerZ += speed * dt;
    if (playerZ >= trackLength) playerZ -= trackLength;

    if (currentSegment.coin && currentSegment.coin.active) {
        if (Math.abs(playerX - currentSegment.coin.x) < 0.4) { 
            currentSegment.coin.active = false;
            coinsCollected++;
            score += 100;
        }
    }

    if (invulnTimer > 0) {
        invulnTimer -= dt;
    } else {
        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            car.z += car.speed * dt;
            if (car.z >= trackLength) car.z -= trackLength;

            if (car.z > playerZ && car.z < playerZ + 150) {
                let spaceX = Math.abs(playerX - car.offset);
                let spaceZ = car.z - playerZ;
                
                if (spaceX < 0.5 && spaceZ < segmentLength * 0.8) {
                    lives--;
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    
                    if (lives <= 0) {
                        speed = 0;
                        gameState = 'gameover';
                        document.getElementById('final-score').innerText = Math.floor(score);
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('cityDrivingHigh', highScore);
                        }
                        hud.classList.add('hidden');
                        gameOverMenu.classList.remove('hidden');
                        return;
                    } else {
                        speed = 0; // Complete stop on crash
                        invulnTimer = 2.0; 
                    }
                }
            }
        }
    }

    score += (speed / activeMaxSpeed) * dt * 50;
    uiScore.innerText = Math.floor(score);
    uiSpeed.innerText = Math.floor((speed / activeMaxSpeed) * 120); // City speed max 120kmh
    uiLives.innerText = lives;
    uiCoins.innerText = coinsCollected;
}

function drawSceneGraph() {
    ctx.clearRect(0, 0, width, height);

    const baseSegment = findSegment(playerZ);
    const startPercent = (playerZ % segmentLength) / segmentLength;
    const camZ = playerZ;
    let baseCamY = 0; // Flat city, no hills
    const camY = baseCamY + cameraHeight;

    renderCitySky(ctx);

    let maxClipY = height, xMultiplier = 0, deltaX = 0;

    for (let n = 0; n < drawDistance; n++) {
        const segment = track[(baseSegment.index + n) % track.length];
        segment.looped = segment.index < baseSegment.index;

        xMultiplier += deltaX;
        deltaX += segment.curve;

        project(segment.p1, (playerX * roadWidth) - xMultiplier, camY, camZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);
        project(segment.p2, (playerX * roadWidth) - xMultiplier - deltaX, camY, camZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);

        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= maxClipY) continue;

        // Sidewalks
        drawPolygon(ctx, 0, segment.p1.screen.y, width, segment.p1.screen.y, width, segment.p2.screen.y, 0, segment.p2.screen.y, segment.color.grass);
        // Curb
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w * 1.1, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w * 1.1, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w * 1.1, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w * 1.1, segment.p2.screen.y, segment.color.rumble);
        // Asphalt Road
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w, segment.p2.screen.y, segment.color.road);

        // Yellow City Center Line
        if (segment.color.lane === '#FFD700') {
            let laneW1 = segment.p1.screen.w * 0.02;
            let laneW2 = segment.p2.screen.w * 0.02;
            drawPolygon(ctx, segment.p1.screen.x - laneW1, segment.p1.screen.y, segment.p1.screen.x + laneW1, segment.p1.screen.y, segment.p2.screen.x + laneW2, segment.p2.screen.y, segment.p2.screen.x - laneW2, segment.p2.screen.y, segment.color.lane);
        }
        maxClipY = segment.p1.screen.y;
    }

    for (let n = drawDistance - 1; n > 0; n--) {
        const segment = track[(baseSegment.index + n) % track.length];

        if (segment.coin && segment.coin.active) {
            let coinX = segment.p1.screen.x + (segment.coin.x * segment.p1.screen.w);
            let coinR = 0.15 * segment.p1.screen.w; 
            drawCoin(ctx, coinX, segment.p1.screen.y, coinR);
        }

        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            let carSegment = findSegment(car.z);
            if (carSegment.index === segment.index) {
                let carX = segment.p1.screen.x + (car.offset * segment.p1.screen.w);
                let carW = 0.8 * segment.p1.screen.w; 
                let carH = carW * 0.6; // Boxy proportions
                drawCityCar(ctx, carX, segment.p1.screen.y, carW, carH, car.color, 0, false);
            }
        }
    }

    if (invulnTimer <= 0 || Math.floor(invulnTimer * 10) % 2 === 0) {
        let pW = width < height ? width * 0.4 : width * 0.2; 
        let pH = pW * 0.6; // Hatchback style
        let pX = width / 2;
        let pY = height - (width < height ? 250 : 150); // Leave room for UI
        
        drawCityCar(ctx, pX, pY, pW, pH, '#FFA500', steerInput, true); 
    }
}

function runHeartbeat(time) {
    if (gameState === 'playing') {
        let dt = (time - lastTime) / 1000;
        if (dt < 0) dt = 0; 
        if (dt > 0.05) dt = 0.05; 
        
        updateEngineState(dt);
        drawSceneGraph();
    }
    lastTime = time;
    animationFrameId = requestAnimationFrame(runHeartbeat);
}

function startGame() {
    mainMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');
    hud.classList.remove('hidden');
    
    playerX = 0;
    playerZ = 0;
    speed = 0;
    steerInput = 0;
    wheelVisual.style.transform = `rotate(0deg)`;
    score = 0;
    lives = 3;
    coinsCollected = 0;
    invulnTimer = 0;
    
    resetTrack();
    gameState = 'playing';
    
    cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame((time) => {
        lastTime = time;
        runHeartbeat(time);
    });
}

resetTrack();
drawSceneGraph();
</script>
</body>
</html>
