<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Racing Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Professional UI Overlay */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; }
        .menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 20; backdrop-filter: blur(10px); text-align: center; padding: 20px; }
        .hidden { display: none !important; }
        
        h1 { color: #fff; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #aaa; font-size: 1.2rem; margin-bottom: 30px; font-weight: 400; }
        
        button { background: #2196F3; border: none; padding: 15px 40px; color: #fff; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4); transition: transform 0.1s; text-transform: uppercase; }
        button:active { transform: scale(0.95); background: #1976D2; }

        /* HUD */
        .hud-top { display: flex; justify-content: space-between; width: 100%; padding: 15px; pointer-events: none; }
        .hud-card { background: rgba(30, 40, 50, 0.9); border: 2px solid rgba(255, 255, 255, 0.1); padding: 10px 15px; border-radius: 12px; color: #fff; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .speedometer { font-size: 2rem; color: #fff; font-style: italic; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .stats-row { display: flex; gap: 15px; margin-bottom: 5px; font-size: 1.2rem; }

        /* Refined Mobile Controls */
        .mobile-controls { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; padding: 20px; pointer-events: auto; padding-bottom: 30px; }
        .control-block { display: flex; gap: 15px; }
        
        .touch-btn { width: 70px; height: 70px; background: rgba(40, 40, 40, 0.85); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; color: #fff; font-size: 26px; display: flex; justify-content: center; align-items: center; font-weight: bold; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .touch-btn:active { background: rgba(255, 255, 255, 0.9); color: #000; border-color: #fff; }
        
        .btn-gas { background: rgba(76, 175, 80, 0.85); }
        .btn-gas:active { background: #4CAF50; color: #fff; }
        .btn-brake { background: rgba(244, 67, 54, 0.85); }
        .btn-brake:active { background: #F44336; color: #fff; }

        @media(orientation: portrait) {
            .touch-btn { width: 65px; height: 65px; font-size: 24px; }
            .mobile-controls { padding: 15px; padding-bottom: 35px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer" id="hud" class="hidden">
        <div class="hud-top">
            <div class="hud-card">
                <div class="stats-row">
                    <span>❤️ <span id="ui-lives">3</span></span>
                    <span style="margin-left: 10px;">🪙 <span id="ui-coins">0</span></span>
                </div>
                <div style="color: #4CAF50; font-size: 14px; margin-top: 5px;">SCORE: <span id="ui-score">0</span></div>
            </div>
            <div class="hud-card" style="text-align: right; background: rgba(30, 40, 50, 0.9);">
                <div class="speedometer"><span id="ui-speed">0</span> KM/H</div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="control-block">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="control-block">
                <div class="touch-btn btn-brake" id="btn-brake">B</div>
                <div class="touch-btn btn-gas" id="btn-gas">G</div>
            </div>
        </div>
    </div>

    <div class="menu" id="main-menu">
        <h1>PRO RACING</h1>
        <h2 id="menu-highscore">HIGH SCORE: 0</h2>
        <button id="start-btn">Start Race</button>
        <p style="color: #aaa; margin-top: 25px; font-size: 0.9rem;">
            Desktop: Arrows to Steer | Up/Down for Gas/Brake
        </p>
    </div>

    <div class="menu hidden" id="game-over-menu">
        <h1 style="color: #F44336;">GAME OVER</h1>
        <div style="color: #fff; font-size: 1.4rem; margin: 20px 0;">Final Score: <span id="final-score" style="color: #4CAF50;">0</span></div>
        <button id="restart-btn">Try Again</button>
    </div>
</div>

<script>
/**
 * GRAPHICS CORE & PHYSICS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

let gameState = 'menu';
let lastTime = 0;
let animationFrameId;

// Environment Constants
const roadWidth = 2000;
const segmentLength = 200;
const rumbleLength = 3;
const drawDistance = 250; 
let fov = 100;
const cameraHeight = 1100;
let cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);

// Player Setup
let playerX = 0;
let playerZ = 0;
let speed = 0;
const maxSpeed = segmentLength / (1/60); 
const accel = maxSpeed / 5;
const braking = -maxSpeed * 0.9;
const decel = -maxSpeed / 8;

let lives = 3;
let coinsCollected = 0;
let score = 0;
let highScore = localStorage.getItem('proRacingHighScore') || 0;
let invulnTimer = 0;

let track = [];
let trackLength = 0;
let traffic = [];

// Input Management
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

function mapTouch(id, targetKey) {
    const target = document.getElementById(id);
    target.addEventListener('touchstart', (e) => { e.preventDefault(); keys[targetKey] = true; if(navigator.vibrate) navigator.vibrate(10); }, {passive: false});
    target.addEventListener('touchend', (e) => { e.preventDefault(); keys[targetKey] = false; }, {passive: false});
}
mapTouch('btn-left', 'ArrowLeft');
mapTouch('btn-right', 'ArrowRight');
mapTouch('btn-gas', 'ArrowUp');
mapTouch('btn-brake', 'ArrowDown');

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    fov = (width < height) ? 120 : 95; 
    cameraDepth = 1 / Math.tan((fov / 2) * Math.PI / 180);
});
window.dispatchEvent(new Event('resize'));

const uiScore = document.getElementById('ui-score');
const uiHighScore = document.getElementById('ui-highscore');
const uiSpeed = document.getElementById('ui-speed');
const uiLives = document.getElementById('ui-lives');
const uiCoins = document.getElementById('ui-coins');
const mainMenu = document.getElementById('main-menu');
const gameOverMenu = document.getElementById('game-over-menu');
const hud = document.getElementById('hud');

document.getElementById('menu-highscore').innerText = `HIGH SCORE: ${Math.floor(highScore)}`;
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

function project(point, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    point.camera.x = (point.world.x || 0) - cameraX;
    point.camera.y = (point.world.y || 0) - cameraY;
    point.camera.z = (point.world.z || 0) - cameraZ;
    point.screen.scale = cameraDepth / point.camera.z;
    point.screen.x = Math.round((width / 2) + (point.screen.scale * point.camera.x * width / 2));
    point.screen.y = Math.round((height / 2) - (point.screen.scale * point.camera.y * height / 2));
    point.screen.w = Math.round((point.screen.scale * roadWidth * width / 2));
}

function resetTrack() {
    track = [];
    traffic = [];
    const totalSegments = 3000;
    
    // Generate Track and Coins
    for (let i = 0; i < totalSegments; i++) {
        let curve = 0;
        let y = 0;
        
        if (i > 200 && i < 400) curve = 2.5;
        if (i > 600 && i < 900) curve = -2.5;
        if (i > 1100 && i < 1500) { curve = 1.8; y = Math.sin(i / 30) * 1200; }
        if (i > 1800 && i < 2400) { curve = -2.8; y = Math.cos(i / 20) * 1500; }

        track.push({
            index: i,
            p1: { world: { x: 0, y: 0, z: i * segmentLength }, camera: {}, screen: {} },
            p2: { world: { x: 0, y: 0, z: (i + 1) * segmentLength }, camera: {}, screen: {} },
            curve: curve,
            color: Math.floor(i / rumbleLength) % 2 ? 
                { road: '#555555', grass: '#2e7d32', rumble: '#ffffff', lane: '#ffffff' } : 
                { road: '#424242', grass: '#1b5e20', rumble: '#d32f2f', lane: '#424242' },
            coin: (Math.random() > 0.92) ? { x: (Math.random() * 1.6) - 0.8, active: true } : null
        });
    }

    for (let i = 1; i < totalSegments; i++) {
        track[i].p1.world.y = track[i - 1].p2.world.y;
    }
    trackLength = track.length * segmentLength;

    // Generate Traffic Cars
    let colors = ['#F44336', '#2196F3', '#FF9800', '#9C27B0', '#FFFFFF', '#00BCD4'];
    for (let j = 100; j < totalSegments - 100; j += 40) {
        if (Math.random() > 0.4) {
            traffic.push({
                offset: (Math.random() * 1.6) - 0.8, // Position across road width
                z: j * segmentLength,
                speed: maxSpeed * (0.25 + Math.random() * 0.3),
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }
    }
}

function findSegment(z) {
    let index = Math.floor(z / segmentLength) % track.length;
    if (index < 0) index += track.length; 
    return track[index];
}

function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function renderBackground(ctx) {
    let gradient = ctx.createLinearGradient(0, 0, 0, height * 0.6);
    gradient.addColorStop(0, '#4facfe'); // Light blue top
    gradient.addColorStop(1, '#b3e5fc'); // Faded horizon
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
}

// Rewritten drawing function perfectly sized via pixel variables (w, h)
function drawRealisticCar(ctx, x, y, w, h, color, turnValue, isPlayer) {
    x = x - w / 2;
    y = y - h;

    // Shadow underneath car
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x, y + h*0.9, w, h * 0.2);

    // Tires
    ctx.fillStyle = '#111';
    let steerOffset = turnValue * w * 0.15;
    ctx.fillRect(x + steerOffset, y + h * 0.65, w * 0.2, h * 0.35);
    ctx.fillRect(x + w * 0.8 + steerOffset, y + h * 0.65, w * 0.2, h * 0.35);

    // Chassis base
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x + w*0.05, y + h*0.75, w*0.9, h*0.25);

    // Main Car Body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.05, y + h*0.75);
    ctx.lineTo(x + w * 0.15, y + h * 0.35);
    ctx.lineTo(x + w * 0.85, y + h * 0.35);
    ctx.lineTo(x + w * 0.95, y + h*0.75);
    ctx.closePath();
    ctx.fill();
    
    // Roof & Cabin
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.2, y + h * 0.35);
    ctx.lineTo(x + w * 0.3, y);
    ctx.lineTo(x + w * 0.7, y);
    ctx.lineTo(x + w * 0.8, y + h * 0.35);
    ctx.closePath();
    ctx.fill();

    // Rear Window
    ctx.fillStyle = '#5dade2';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.25, y + h * 0.3);
    ctx.lineTo(x + w * 0.32, y + h * 0.05);
    ctx.lineTo(x + w * 0.68, y + h * 0.05);
    ctx.lineTo(x + w * 0.75, y + h * 0.3);
    ctx.closePath();
    ctx.fill();
    
    // Taillights
    ctx.fillStyle = (keys.ArrowDown && isPlayer) ? '#ff0000' : '#8b0000';
    ctx.fillRect(x + w * 0.1, y + h * 0.45, w * 0.15, h * 0.2);
    ctx.fillRect(x + w * 0.75, y + h * 0.45, w * 0.15, h * 0.2);
    
    // License Plate
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + w * 0.4, y + h * 0.55, w * 0.2, h * 0.15);
}

function drawCoin(ctx, x, y, r) {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(x, y - r, r, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.strokeStyle = '#B8860B';
    ctx.lineWidth = Math.max(1, r * 0.1);
    ctx.stroke();
    
    ctx.fillStyle = '#DAA520';
    ctx.beginPath();
    ctx.arc(x, y - r, r * 0.6, 0, Math.PI * 2);
    ctx.fill();
}

function updateEngineState(dt) {
    if (gameState !== 'playing') return;

    const currentSegment = findSegment(playerZ);
    const speedRatio = speed / maxSpeed;
    
    // Steering Physics (stronger turn factor to counteract drift)
    let turnFactor = dt * 3.5 * Math.max(0.3, speedRatio);

    if (keys.ArrowLeft) playerX -= turnFactor;
    if (keys.ArrowRight) playerX += turnFactor;
    
    // Centrifugal curve drift (pushes car outward on corners)
    playerX -= (turnFactor * speedRatio * currentSegment.curve * 1.2);

    // Hard Boundaries: Strictly clamp car between left (-1.0) and right (1.0) edges
    playerX = Math.max(-1.0, Math.min(1.0, playerX));

    // Acceleration & Braking
    if (keys.ArrowUp) speed += accel * dt;
    else if (keys.ArrowDown) speed += braking * dt;
    else speed += decel * dt;

    speed = Math.max(0, Math.min(speed, maxSpeed));
    playerZ += speed * dt;
    if (playerZ >= trackLength) playerZ -= trackLength;

    // Detect Coin Pickup
    if (currentSegment.coin && currentSegment.coin.active) {
        if (Math.abs(playerX - currentSegment.coin.x) < 0.4) {
            currentSegment.coin.active = false;
            coinsCollected++;
            score += 500;
            if (navigator.vibrate) navigator.vibrate(20);
        }
    }

    // Traffic Collision
    if (invulnTimer > 0) {
        invulnTimer -= dt;
    } else {
        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            car.z += car.speed * dt;
            if (car.z >= trackLength) car.z -= trackLength;

            if (car.z > playerZ && car.z < playerZ + 200) {
                let spaceX = Math.abs(playerX - car.offset);
                let spaceZ = car.z - playerZ;
                
                if (spaceX < 0.6 && spaceZ < segmentLength * 1.2) {
                    lives--;
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    
                    if (lives <= 0) {
                        speed = 0;
                        gameState = 'gameover';
                        document.getElementById('final-score').innerText = Math.floor(score);
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('proRacingHighScore', highScore);
                        }
                        hud.classList.add('hidden');
                        gameOverMenu.classList.remove('hidden');
                        return;
                    } else {
                        speed = maxSpeed * 0.3; // Slow down but survive
                        invulnTimer = 2.0; // Invincible for 2s
                    }
                }
            }
        }
    }

    score += (speed / maxSpeed) * dt * 100;
    
    uiScore.innerText = Math.floor(score);
    uiSpeed.innerText = Math.floor((speed / maxSpeed) * 220); // Simulates 220 KM/H top speed
    uiLives.innerText = lives;
    uiCoins.innerText = coinsCollected;
}

function drawSceneGraph() {
    ctx.fillStyle = '#4facfe'; // Background color clear
    ctx.fillRect(0, 0, width, height);

    const baseSegment = findSegment(playerZ);
    const startPercent = (playerZ % segmentLength) / segmentLength;

    const camZ = playerZ;
    let baseCamY = baseSegment.p1.world.y + (baseSegment.p2.world.y - baseSegment.p1.world.y) * startPercent;
    const camY = baseCamY + cameraHeight;

    renderBackground(ctx);

    let maxClipY = height;
    let xMultiplier = 0;
    let deltaX = 0;

    // Draw Track Polygons (Front to Back)
    for (let n = 0; n < drawDistance; n++) {
        const segment = track[(baseSegment.index + n) % track.length];
        segment.looped = segment.index < baseSegment.index;

        xMultiplier += deltaX;
        deltaX += segment.curve;

        project(segment.p1, (playerX * roadWidth) - xMultiplier, camY, camZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);
        project(segment.p2, (playerX * roadWidth) - xMultiplier - deltaX, camY, camZ - (segment.looped ? trackLength : 0), cameraDepth, width, height, roadWidth);

        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= maxClipY) continue;

        drawPolygon(ctx, 0, segment.p1.screen.y, width, segment.p1.screen.y, width, segment.p2.screen.y, 0, segment.p2.screen.y, segment.color.grass);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w * 1.1, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w * 1.1, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w * 1.1, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w * 1.1, segment.p2.screen.y, segment.color.rumble);
        drawPolygon(ctx, segment.p1.screen.x - segment.p1.screen.w, segment.p1.screen.y, segment.p1.screen.x + segment.p1.screen.w, segment.p1.screen.y, segment.p2.screen.x + segment.p2.screen.w, segment.p2.screen.y, segment.p2.screen.x - segment.p2.screen.w, segment.p2.screen.y, segment.color.road);

        if (segment.color.lane === '#ffffff') {
            let laneW1 = segment.p1.screen.w * 0.02;
            let laneW2 = segment.p2.screen.w * 0.02;
            drawPolygon(ctx, segment.p1.screen.x - laneW1, segment.p1.screen.y, segment.p1.screen.x + laneW1, segment.p1.screen.y, segment.p2.screen.x + laneW2, segment.p2.screen.y, segment.p2.screen.x - laneW2, segment.p2.screen.y, segment.color.lane);
        }

        maxClipY = segment.p1.screen.y;
    }

    // Draw Sprites (Back to Front)
    for (let n = drawDistance - 1; n > 0; n--) {
        const segment = track[(baseSegment.index + n) % track.length];

        // Draw Coins
        if (segment.coin && segment.coin.active) {
            let coinX = segment.p1.screen.x + (segment.coin.x * segment.p1.screen.w);
            let coinR = 0.15 * segment.p1.screen.w; // Coin size relative to road width
            drawCoin(ctx, coinX, segment.p1.screen.y, coinR);
        }

        // Draw Traffic
        for (let i = 0; i < traffic.length; i++) {
            let car = traffic[i];
            let carSegment = findSegment(car.z);
            if (carSegment.index === segment.index) {
                let carX = segment.p1.screen.x + (car.offset * segment.p1.screen.w);
                let carW = 0.8 * segment.p1.screen.w; // Car width is 80% of a lane width
                let carH = carW * 0.5; // Aspect ratio
                drawRealisticCar(ctx, carX, segment.p1.screen.y, carW, carH, car.color, 0, false);
            }
        }
    }

    // Draw Player Car LAST (Guarantees it is always perfectly visible)
    if (invulnTimer <= 0 || Math.floor(invulnTimer * 10) % 2 === 0) {
        // Player car dynamically scales based on device screen proportions
        let pW = width < height ? width * 0.35 : width * 0.18; 
        let pH = pW * 0.5;
        let pX = width / 2;
        let pY = height - (width < height ? 180 : 80); // Floating above the UI buttons
        let steerDirection = (keys.ArrowLeft ? -1 : keys.ArrowRight ? 1 : 0);
        
        drawRealisticCar(ctx, pX, pY, pW, pH, '#ff3300', steerDirection, true);
    }
}

function runHeartbeat(time) {
    if (gameState === 'playing') {
        let dt = (time - lastTime) / 1000;
        if (dt < 0) dt = 0; 
        if (dt > 0.1) dt = 0.1; // Fixes large jumps if tab is inactive
        
        updateEngineState(dt);
        drawSceneGraph();
    }
    lastTime = time;
    animationFrameId = requestAnimationFrame(runHeartbeat);
}

function startGame() {
    mainMenu.classList.add('hidden');
    gameOverMenu.classList.add('hidden');
    hud.classList.remove('hidden');
    
    playerX = 0;
    playerZ = 0;
    speed = 0;
    score = 0;
    lives = 3;
    coinsCollected = 0;
    invulnTimer = 0;
    
    resetTrack();
    gameState = 'playing';
    
    cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame((time) => {
        lastTime = time;
        runHeartbeat(time);
    });
}

// Initial backdrop draw before pressing play
resetTrack();
drawSceneGraph();
</script>
</body>
</html>
